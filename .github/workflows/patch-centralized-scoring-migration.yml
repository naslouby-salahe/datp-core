name: Patch centralized scoring migration

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/patch-centralized-scoring-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0
      - name: Preserve focused validation output without discarding migration
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/migrate-centralized-scoring.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''      - name: Validate architecture and scoring collection
        run: |
          uv run pytest -q tests/architecture/test_architecture_ratchets.py tests/unit/centralized_reference/test_scoring.py
'''
          new = '''      - name: Capture architecture and scoring validation
        run: |
          set +e
          uv run pytest -q tests/architecture/test_architecture_ratchets.py tests/unit/centralized_reference/test_scoring.py > centralized-scoring-validation.txt 2>&1
          set -e
'''
          if text.count(old) != 1:
              raise SystemExit('validation block did not match exactly')
          workflow.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/patch-centralized-scoring-migration.yml').unlink()
      - name: Commit workflow patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture centralized scoring migration validation"
          git push origin HEAD:agent/phase-12-16-target-architecture
