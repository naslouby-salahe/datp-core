name: Refactor Workspace

on:
  push:
    branches:
      - agent/deep-architecture-refactor

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export exact branch workspace
        if: ${{ !hashFiles('tools/refactor.ready') }}
        run: |
          tar --exclude=.git -czf /tmp/datp-core-workspace.tar.gz .
          cp /tmp/datp-core-workspace.tar.gz datp-core-workspace.tar.gz

      - name: Upload workspace
        if: ${{ !hashFiles('tools/refactor.ready') }}
        uses: actions/upload-artifact@v4
        with:
          name: datp-core-workspace
          path: datp-core-workspace.tar.gz
          retention-days: 1

      - name: Apply reviewed refactor patch
        if: ${{ hashFiles('tools/refactor.ready') != '' }}
        run: |
          cat tools/refactor.patch.gz.b64.* | base64 --decode > /tmp/refactor.patch.gz
          gzip -dc /tmp/refactor.patch.gz > /tmp/refactor.patch
          git apply --index /tmp/refactor.patch
          git rm tools/refactor.ready tools/refactor.patch.gz.b64.* .github/workflows/refactor-workspace.yml

      - name: Set up uv
        if: ${{ hashFiles('tools/refactor.ready') != '' }}
        uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        if: ${{ hashFiles('tools/refactor.ready') != '' }}
        run: |
          uv python install 3.12
          uv sync --frozen --group dev

      - name: Format and validate completed migrations
        if: ${{ hashFiles('tools/refactor.ready') != '' }}
        run: |
          uv run ruff check --fix src tests
          uv run ruff format src tests
          uv run python -m compileall -q src tests
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pyright
          uv run python -m importlinter
          uv run pytest -q

      - name: Push completed refactor
        if: ${{ hashFiles('tools/refactor.ready') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete remaining architecture migrations'
          git push
