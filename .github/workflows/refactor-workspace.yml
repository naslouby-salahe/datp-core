name: Refactor Workspace

on:
  push:
    branches:
      - agent/deep-architecture-refactor

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export exact branch workspace
        if: ${{ !hashFiles('tools/refactor.patch') }}
        run: tar --exclude=.git -czf datp-core-workspace.tar.gz .

      - name: Upload workspace
        if: ${{ !hashFiles('tools/refactor.patch') }}
        uses: actions/upload-artifact@v4
        with:
          name: datp-core-workspace
          path: datp-core-workspace.tar.gz
          retention-days: 1

      - name: Apply reviewed refactor patch
        if: ${{ hashFiles('tools/refactor.patch') != '' }}
        run: |
          git apply --index tools/refactor.patch
          git rm tools/refactor.patch .github/workflows/refactor-workspace.yml

      - name: Set up Python
        if: ${{ hashFiles('tools/refactor.patch') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project
        if: ${{ hashFiles('tools/refactor.patch') != '' }}
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Validate completed migrations
        if: ${{ hashFiles('tools/refactor.patch') != '' }}
        run: |
          python -m compileall -q src tests
          ruff check src tests
          ruff format --check src tests
          pyright
          python -m importlinter
          PYTHONPATH=src pytest -q

      - name: Push completed refactor
        if: ${{ hashFiles('tools/refactor.patch') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete remaining architecture migrations'
          git push
