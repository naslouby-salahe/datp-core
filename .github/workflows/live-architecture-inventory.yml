name: Live architecture inventory

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/live-architecture-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0

      - name: Print live package and import inventory
        run: |
          echo '=== SOURCE ROOT ==='
          find src/datp_core -maxdepth 2 -type d | sort
          echo '=== ARTIFACT IMPORTS ==='
          grep -RIn --include='*.py' 'datp_core\.artifacts' src tests || true
          echo '=== CENTRALIZED REFERENCE IMPORTS ==='
          grep -RIn --include='*.py' 'datp_core\.centralized_reference' src tests || true
          echo '=== LEARNING CHECKPOINT IMPORTS ==='
          grep -RIn --include='*.py' 'learning\.federated\.checkpoints' src tests || true
          echo '=== PIPELINE IMPORTS FROM CAPABILITIES ==='
          grep -RIn --include='*.py' 'from datp_core\.pipeline\|import datp_core\.pipeline' \
            src/datp_core/datasets src/datp_core/populations src/datp_core/preprocessing \
            src/datp_core/learning src/datp_core/calibration src/datp_core/thresholding \
            src/datp_core/evaluation src/datp_core/analysis src/datp_core/anchor || true

      - name: Remove inventory workflow
        run: |
          rm .github/workflows/live-architecture-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-shot architecture inventory"
          git push origin HEAD:agent/phase-12-16-target-architecture
