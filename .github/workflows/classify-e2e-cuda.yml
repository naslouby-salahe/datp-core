name: Classify centralized E2E as CUDA-only

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/classify-e2e-cuda.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0

      - name: Add exact CUDA module classification
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('tests/pytest_cuda.py')
          text = path.read_text(encoding='utf-8')
          module = '        "tests/e2e/test_centralized_reference_pipeline.py",\n'
          anchor = '        "tests/integration/pipeline/test_centralized_reference.py",\n'
          if module in text:
              raise SystemExit('centralized E2E is already classified')
          if text.count(anchor) != 1:
              raise SystemExit('CUDA module anchor is not unique')
          path.write_text(text.replace(anchor, module + anchor), encoding='utf-8')
          Path('.github/workflows/classify-e2e-cuda.yml').unlink()
          PY

      - name: Commit without force-updating concurrent work
        run: |
          set -euo pipefail
          branch='agent/phase-12-16-target-architecture'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Classify centralized E2E as CUDA-only'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            git pull --rebase origin "$branch"
          done
          exit 1
