name: Refresh uv lock

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/refresh-uv-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate lockfile
        run: uv lock
      - name: Commit refreshed lock and remove workflow
        run: |
          rm .github/workflows/refresh-uv-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh dependency lock after CLI refactor"
          git push origin HEAD:agent/phase-12-16-target-architecture
