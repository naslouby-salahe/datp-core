name: Land Phase 16 E2E layer

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/land-phase16-e2e.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0

      - name: Import prepared E2E tree and rebase safely
        run: |
          set -euo pipefail
          branch='agent/phase-12-16-target-architecture'
          prepared='c363c3700b488f4bf362673564035eb1f4e9ac47'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$branch"
          git fetch origin "$prepared"
          git reset --hard "origin/$branch"
          git checkout "$prepared" -- tests/e2e
          git rm .github/workflows/land-phase16-e2e.yml
          git add tests/e2e
          git commit -m 'Add Phase 16 end-to-end acceptance layer'

          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            git pull --rebase origin "$branch"
          done
          echo 'Unable to land E2E commit without a force push' >&2
          exit 1
