name: Source audit snapshot

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Package auditable repository state
        run: tar -czf datp-core-audit.tar.gz src tests docs pyproject.toml uv.lock

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: datp-core-audit
          path: datp-core-audit.tar.gz
          if-no-files-found: error
          retention-days: 1
