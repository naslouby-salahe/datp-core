name: Apply zero-safe count contracts

"on": [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
      - name: Patch zero-safe count contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != count:
                  raise SystemExit(f"{path}: expected {count} matches for {old!r}, got {text.count(old)}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          replace(
              "src/datp_core/populations/models.py",
              "    ClientCount,\n    DirichletConcentration,",
              "    ClientCount,\n    DirichletConcentration,\n    NonNegativeIntegerValue,",
          )
          replace(
              "src/datp_core/populations/models.py",
              "    observed_eligible_group_count: ClientCount",
              "    observed_eligible_group_count: NonNegativeIntegerValue",
          )
          replace(
              "src/datp_core/populations/models.py",
              "    observed_client_count: ClientCount",
              "    observed_client_count: NonNegativeIntegerValue",
          )

          replace(
              "src/datp_core/populations/edge_temporal_groups.py",
              "from datp_core.domain.values import Checksum, ClientCount, RowCount, Seed",
              "from datp_core.domain.values import Checksum, ClientCount, NonNegativeIntegerValue, RowCount, Seed",
          )
          replace(
              "src/datp_core/populations/edge_temporal_groups.py",
              "observed_eligible_group_count=ClientCount(len(eligible_ids))",
              "observed_eligible_group_count=NonNegativeIntegerValue(len(eligible_ids))",
          )

          replace(
              "src/datp_core/populations/integrity.py",
              "from datp_core.domain.values import Checksum, ClientCount, RowCount, Seed",
              "from datp_core.domain.values import Checksum, ClientCount, NonNegativeIntegerValue, RowCount, Seed",
          )
          replace(
              "src/datp_core/populations/integrity.py",
              "        ClientCount(accepted_n),",
              "        NonNegativeIntegerValue(accepted_n),",
          )
          replace(
              "src/datp_core/populations/integrity.py",
              "        PopulationFeasibilityStatus.INFEASIBLE, reason, expected, ClientCount(observed), evidence",
              "        PopulationFeasibilityStatus.INFEASIBLE, reason, expected, NonNegativeIntegerValue(observed), evidence",
          )

          replace(
              "tests/unit/populations/test_edge_temporal_groups.py",
              "from datp_core.domain.values import ClientCount, Seed",
              "from datp_core.domain.values import NonNegativeIntegerValue, Seed",
          )
          replace(
              "tests/unit/populations/test_edge_temporal_groups.py",
              "ClientCount(0)",
              "NonNegativeIntegerValue(0)",
          )
          replace(
              "tests/unit/populations/test_edge_temporal_groups.py",
              "ClientCount(9)",
              "NonNegativeIntegerValue(9)",
          )

          replace(
              "src/datp_core/thresholding/models.py",
              "        require_contract(\n"
              "            0.0 < self.coverage.value <= 1.0,\n"
              "            \"conformal coverage must be in (0, 1]\",\n"
              "            ContractSubject.THRESHOLD,\n"
              "        )\n",
              "",
          )
          replace(
              "tests/unit/thresholding/test_models.py",
              "    assert result.significance == Ratio(0.05)",
              "    assert result.significance.value == pytest.approx(0.05)",
          )
          PY
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Use zero-safe observed count contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
