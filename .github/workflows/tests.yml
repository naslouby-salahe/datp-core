name: Validate typed dataset coordinates

"on": [push, pull_request]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Apply dataset coordinate contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import subprocess

          source_commit = "be06766ee3ff5ba371e5120ca0d5b97c50196892"
          subprocess.run(
              ["git", "fetch", "origin", source_commit, "--depth=1"],
              check=True,
              stdout=subprocess.DEVNULL,
          )
          workflow = subprocess.check_output(
              ["git", "show", f"{source_commit}:.github/workflows/tests.yml"],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("\n          PY", start)
          patch_script = dedent(workflow[start:end])
          exec(compile(patch_script, "typed-dataset-coordinate-patch", "exec"), {})

          materialization_path = Path("src/datp_core/datasets/materialization.py")
          materialization = materialization_path.read_text(encoding="utf-8")
          if "CanonicalColumnPosition" not in materialization:
              materialization = materialization.replace(
                  "from datp_core.domain.values import ByteCount, Checksum, RowCount, checksum_file, checksum_text",
                  "from datp_core.domain.values import (\n"
                  "    ByteCount,\n"
                  "    CanonicalColumnPosition,\n"
                  "    Checksum,\n"
                  "    RowCount,\n"
                  "    checksum_file,\n"
                  "    checksum_text,\n"
                  ")",
                  1,
              )
          materialization = materialization.replace(
              "        position,\n    )\n\n\ndef canonical_provenance_arrow_field",
              "        CanonicalColumnPosition(position),\n    )\n\n\ndef canonical_provenance_arrow_field",
              1,
          )
          if "CanonicalColumnPosition(position)" not in materialization:
              raise SystemExit("canonical provenance position boundary was not converted")
          materialization_path.write_text(materialization, encoding="utf-8")

          models_path = Path("src/datp_core/datasets/models.py")
          models = models_path.read_text(encoding="utf-8")
          persisted_field = "    duplicate_timestamp_count: int"
          typed_persisted_field = "    duplicate_timestamp_count: RowCount"
          if models.count(persisted_field) != 1:
              raise SystemExit(
                  f"persisted chronology duplicate-count fields: {models.count(persisted_field)}"
              )
          models = models.replace(persisted_field, typed_persisted_field, 1)
          models_path.write_text(models, encoding="utf-8")

          tests_path = Path("tests/unit/datasets/test_dataset_models.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "from datp_core.datasets.models import (",
              "from datp_core.datasets.models import (",
              1,
          )
          if "    _ChronologyEntry,\n" not in tests:
              if "from datp_core.datasets.models import (" in tests:
                  tests = tests.replace(
                      "from datp_core.datasets.models import (\n",
                      "from datp_core.datasets.models import (\n    _ChronologyEntry,\n",
                      1,
                  )
              else:
                  tests = tests.replace(
                      "from datp_core.datasets.models import ",
                      "from datp_core.datasets.models import _ChronologyEntry, ",
                      1,
                  )
          regression = dedent('''
              def test_manifest_chronology_rehydrates_typed_duplicate_count() -> None:
                  entry = _ChronologyEntry.model_validate_json(
                      """{
                          "group_identity": "Modbus",
                          "status": "available",
                          "total_rows": 10,
                          "parseable_rows": 10,
                          "invalid_rows": 0,
                          "duplicate_timestamp_count": 2,
                          "is_monotonic": true,
                          "reason": "verified chronology",
                          "temporal_eligible": true
                      }"""
                  )
                  assert entry.duplicate_timestamp_count == RowCount(2)
          ''').lstrip()
          if regression.strip() not in tests:
              marker = "\ndef test_canonical_coordinate_is_a_stable_human_readable_dataset_root"
              if marker not in tests:
                  raise SystemExit("dataset model round-trip insertion marker missing")
              tests = tests.replace(
                  marker,
                  "\n" + regression.rstrip() + "\n\n" + marker.lstrip(),
                  1,
              )
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Compile transformed source and tests
        run: python -m compileall -q src tests

      - name: Run persisted chronology regressions
        run: |
          mkdir -p data/raw
          uv run pytest -vv \
            tests/unit/datasets/test_dataset_models.py \
            tests/unit/populations/test_edge_temporal_groups.py \
            tests/unit/orchestration/stages/test_preprocess_stages.py \
            tests/integration/populations/test_temporal_split_no_future_leakage.py

      - name: Run full regression suite
        run: |
          uv run pytest --ignore=tests/integration/configuration/test_raw_source_contracts_are_ready.py

      - name: Commit dataset contracts
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Type dataset ingestion coordinates and counts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
