name: Repair threshold formatting

"on": [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Repair exact generated blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          models_path = Path("src/datp_core/thresholding/models.py")
          models = models_path.read_text(encoding="utf-8")
          replacement = dedent('''
              @dataclass(frozen=True, slots=True)
              class ConformalThresholdResult:
                  """`LOCAL_CONFORMAL_THRESHOLD`: finite-sample local conformal thresholds."""

                  coordinate: FederatedTrainingCoordinate
                  coverage: CoverageTarget
                  eligible_clients: tuple[ClientIdentity, ...]
                  assignments: tuple[ConformalAssignment, ...]
                  unavailable_clients: tuple[ClientIdentity, ...]
                  method: ClassVar[FederatedThresholdMethod] = FederatedThresholdMethod.LOCAL_CONFORMAL_THRESHOLD

                  def __post_init__(self) -> None:
                      require_contract(
                          0.0 < self.coverage.value <= 1.0,
                          "conformal coverage must be in (0, 1]",
                          ContractSubject.THRESHOLD,
                      )
                      require_contract(
                          bool(self.assignments),
                          "a conformal threshold result requires at least one assigned client",
                          ContractSubject.THRESHOLD,
                      )
                      _validate_client_partition(
                          self.eligible_clients, tuple(a.client for a in self.assignments), self.unavailable_clients
                      )

                  @property
                  def significance(self) -> Ratio:
                      """Conformal miscoverage derived from the single authoritative coverage target."""
                      return Ratio(1.0 - self.coverage.value)


              @dataclass(frozen=True, slots=True)
              class ClientBenignSummary:
          ''').lstrip()
          models, count = re.subn(
              r"@dataclass\(frozen=True, slots=True\)\nclass ConformalThresholdResult:.*?"
              r"@dataclass\(frozen=True, slots=True\)\nclass ClientBenignSummary:\n",
              replacement,
              models,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("ConformalThresholdResult repair target not found")
          models_path.write_text(models, encoding="utf-8")

          tests_path = Path("tests/unit/thresholding/test_models.py")
          tests = tests_path.read_text(encoding="utf-8")
          replacement = dedent('''
              def test_conformal_significance_is_derived_from_coverage() -> None:
                  result = ConformalThresholdResult(
                      coordinate=COORDINATE,
                      coverage=CoverageTarget(0.95),
                      eligible_clients=(CLIENT_A,),
                      assignments=(
                          ConformalAssignment(
                              client=CLIENT_A,
                              calibration_count=RowCount(20),
                              rank_index=19,
                              effective_quantile=Quantile(0.95),
                              selected_score=ScoreValue(1.0),
                              tie_count=RowCount(1),
                              threshold=ThresholdValue(1.0),
                          ),
                      ),
                      unavailable_clients=(),
                  )
                  assert result.significance == Ratio(0.05)


              def test_fixed_coefficient_result_holds_its_value() -> None:
          ''').lstrip()
          tests, count = re.subn(
              r"def test_conformal_significance_is_derived_from_coverage\(\) -> None:.*?"
              r"def test_fixed_coefficient_result_holds_its_value\(\) -> None:\n",
              replacement,
              tests,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("conformal significance test repair target not found")
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/datp_core/thresholding/models.py tests/unit/thresholding/test_models.py
          git diff --cached --quiet && exit 0
          git commit -m "Repair threshold model formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
