name: Validate typed conformal ranks

"on": [push, pull_request]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Apply conformal rank typing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_if_needed(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {text.count(old)}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_if_needed(
              "src/datp_core/domain/values.py",
              '''class ReplicateIndex(NonNegativeIntegerValue):
                  validation_name: ClassVar[str] = "replicate index"


              class ClusterIndex'''.replace("              ", ""),
              '''class ReplicateIndex(NonNegativeIntegerValue):
                  validation_name: ClassVar[str] = "replicate index"


              class ConformalRankIndex(PositiveIntegerValue):
                  validation_name: ClassVar[str] = "conformal rank index"


              class ClusterIndex'''.replace("              ", ""),
          )

          quantiles_path = Path("src/datp_core/thresholding/quantiles.py")
          quantiles = quantiles_path.read_text(encoding="utf-8")
          if "    ConformalRankIndex,\n" not in quantiles:
              quantiles = quantiles.replace("    Checksum,\n", "    Checksum,\n    ConformalRankIndex,\n", 1)
          quantiles = quantiles.replace(
              "def conformal_rank_index(calibration_count: RowCount, coverage: CoverageTarget) -> int:",
              "def conformal_rank_index(calibration_count: RowCount, coverage: CoverageTarget) -> ConformalRankIndex:",
              1,
          )
          quantiles = quantiles.replace(
              "    return ceil((n + 1) * coverage.value)",
              "    return ConformalRankIndex(ceil((n + 1) * coverage.value))",
              1,
          )
          quantiles = quantiles.replace(
              ") -> tuple[ThresholdValue, int, Quantile, RowCount]:",
              ") -> tuple[ThresholdValue, ConformalRankIndex, Quantile, RowCount]:",
              1,
          )
          quantiles = quantiles.replace("    if rank_index > calibration_count:", "    if rank_index.value > calibration_count:", 1)
          quantiles = quantiles.replace("    selected = float(ordered[rank_index - 1])", "    selected = float(ordered[rank_index.value - 1])", 1)
          quantiles = quantiles.replace(
              "    effective_quantile = Quantile(rank_index / calibration_count)",
              "    effective_quantile = Quantile(rank_index.value / calibration_count)",
              1,
          )
          quantiles_path.write_text(quantiles, encoding="utf-8")

          conformal_path = Path("src/datp_core/thresholding/conformal.py")
          conformal = conformal_path.read_text(encoding="utf-8")
          conformal = conformal.replace(
              "        if rank_index > calibration_count_int:",
              "        if rank_index.value > calibration_count_int:",
              1,
          )
          conformal_path.write_text(conformal, encoding="utf-8")

          models_path = Path("src/datp_core/thresholding/models.py")
          models = models_path.read_text(encoding="utf-8")
          if "    ConformalRankIndex,\n" not in models:
              models = models.replace("    ClusterIndex,\n", "    ClusterIndex,\n    ConformalRankIndex,\n", 1)
          models = models.replace("    rank_index: int", "    rank_index: ConformalRankIndex", 1)
          old_validation = '''        require_contract(
                      1 <= self.rank_index <= self.calibration_count.value,
                      "conformal rank index must fall within the calibration sample",
                      ContractSubject.THRESHOLD,
                  )
          '''.replace("          ", "")
          new_validation = '''        require_contract(
                      isinstance(self.rank_index, ConformalRankIndex),
                      "conformal rank index must use the typed rank contract",
                      ContractSubject.THRESHOLD,
                  )
                  require_contract(
                      self.rank_index.value <= self.calibration_count.value,
                      "conformal rank index must fall within the calibration sample",
                      ContractSubject.THRESHOLD,
                  )
          '''.replace("          ", "")
          if old_validation in models:
              models = models.replace(old_validation, new_validation, 1)
          elif new_validation not in models:
              raise SystemExit("ConformalAssignment validation block did not match")
          models = models.replace(
              "        expected_quantile = self.rank_index / self.calibration_count.value",
              "        expected_quantile = self.rank_index.value / self.calibration_count.value",
              1,
          )
          models_path.write_text(models, encoding="utf-8")

          coverage_path = Path("src/datp_core/evaluation/conformal_coverage.py")
          coverage = coverage_path.read_text(encoding="utf-8")
          old_import = "from datp_core.domain.values import CoverageTarget, Quantile, RowCount, Seed, ThresholdValue, checksum_file"
          new_import = (
              "from datp_core.domain.values import (\n"
              "    ConformalRankIndex,\n"
              "    CoverageTarget,\n"
              "    Quantile,\n"
              "    RowCount,\n"
              "    Seed,\n"
              "    ThresholdValue,\n"
              "    checksum_file,\n"
              ")"
          )
          if old_import in coverage:
              coverage = coverage.replace(old_import, new_import, 1)
          coverage = coverage.replace("    finite_sample_rank_index: int", "    finite_sample_rank_index: ConformalRankIndex", 1)
          coverage = coverage.replace(
              "        if self.calibration_count.value < 1 or self.finite_sample_rank_index < 1:\n"
              "            raise ScientificContractError(\"conformal diagnostics require a positive calibration count and rank\")",
              "        if self.calibration_count.value < 1:\n"
              "            raise ScientificContractError(\"conformal diagnostics require a positive calibration count\")\n"
              "        if not isinstance(self.finite_sample_rank_index, ConformalRankIndex):\n"
              "            raise ScientificContractError(\"conformal diagnostics require a typed finite-sample rank\")",
              1,
          )
          coverage_path.write_text(coverage, encoding="utf-8")

          test_quantiles_path = Path("tests/unit/thresholding/test_quantiles.py")
          test_quantiles = test_quantiles_path.read_text(encoding="utf-8")
          test_quantiles = test_quantiles.replace(
              "from datp_core.domain.values import CoverageTarget, Quantile, RowCount, SummaryCoefficient, ThresholdValue",
              "from datp_core.domain.values import (\n"
              "    ConformalRankIndex,\n"
              "    CoverageTarget,\n"
              "    Quantile,\n"
              "    RowCount,\n"
              "    SummaryCoefficient,\n"
              "    ThresholdValue,\n"
              ")",
              1,
          )
          test_quantiles = test_quantiles.replace(
              "assert conformal_rank_index(RowCount(99), coverage) == math.ceil(100 * 0.95)",
              "assert conformal_rank_index(RowCount(99), coverage) == ConformalRankIndex(math.ceil(100 * 0.95))",
              1,
          )
          test_quantiles = test_quantiles.replace("    assert rank_index == 96", "    assert rank_index == ConformalRankIndex(96)", 1)
          test_quantiles_path.write_text(test_quantiles, encoding="utf-8")

          test_conformal_path = Path("tests/unit/thresholding/test_conformal.py")
          test_conformal = test_conformal_path.read_text(encoding="utf-8")
          test_conformal = test_conformal.replace(
              "from datp_core.domain.values import Quantile",
              "from datp_core.domain.values import ConformalRankIndex, Quantile",
              1,
          )
          test_conformal = test_conformal.replace(
              "    assert assignment.rank_index == 96",
              "    assert assignment.rank_index == ConformalRankIndex(96)",
              1,
          )
          test_conformal_path.write_text(test_conformal, encoding="utf-8")

          test_models_path = Path("tests/unit/thresholding/test_models.py")
          test_models = test_models_path.read_text(encoding="utf-8")
          if "    ConformalRankIndex,\n" not in test_models:
              test_models = test_models.replace("    ClusterIndex,\n", "    ClusterIndex,\n    ConformalRankIndex,\n", 1)
          test_models = re.sub(r"rank_index=(\d+)", r"rank_index=ConformalRankIndex(\1)", test_models)
          raw_test = '''
          def test_conformal_assignment_rejects_raw_rank_integer() -> None:
              with pytest.raises(ScientificContractError, match="typed rank contract"):
                  ConformalAssignment(
                      client=CLIENT_A,
                      calibration_count=RowCount(10),
                      rank_index=9,  # type: ignore[arg-type]
                      effective_quantile=Quantile(0.9),
                      selected_score=ScoreValue(1.0),
                      tie_count=RowCount(0),
                      threshold=ThresholdValue(1.0),
                  )
          '''.replace("          ", "")
          if raw_test.strip() not in test_models:
              marker = "\ndef test_conformal_assignment_rejects_rank_index_out_of_bounds() -> None:\n"
              if marker not in test_models:
                  raise SystemExit("ConformalAssignment test insertion marker missing")
              test_models = test_models.replace(marker, "\n" + raw_test + marker, 1)
          test_models_path.write_text(test_models, encoding="utf-8")

          coverage_test_path = Path("tests/unit/evaluation/test_conformal_coverage.py")
          coverage_test = coverage_test_path.read_text(encoding="utf-8")
          coverage_test = coverage_test.replace(
              "from datp_core.domain.values import CoverageTarget, Quantile, RowCount, ScoreValue, Seed, ThresholdValue",
              "from datp_core.domain.values import (\n"
              "    ConformalRankIndex,\n"
              "    CoverageTarget,\n"
              "    Quantile,\n"
              "    RowCount,\n"
              "    ScoreValue,\n"
              "    Seed,\n"
              "    ThresholdValue,\n"
              ")",
              1,
          )
          coverage_test = coverage_test.replace(
              "client, RowCount(10), 9, Quantile(0.9)",
              "client, RowCount(10), ConformalRankIndex(9), Quantile(0.9)",
              1,
          )
          coverage_test_path.write_text(coverage_test, encoding="utf-8")
          PY

      - name: Run conformal rank tests
        run: |
          uv run pytest \
            tests/unit/thresholding/test_quantiles.py \
            tests/unit/thresholding/test_conformal.py \
            tests/unit/thresholding/test_models.py \
            tests/unit/evaluation/test_conformal_coverage.py \
            tests/property/test_quantile_monotonicity.py

      - name: Commit typed rank contracts
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Type finite-sample conformal rank indices"
          git push origin "HEAD:${GITHUB_REF_NAME}"
