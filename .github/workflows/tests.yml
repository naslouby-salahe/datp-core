name: Validate atomic staging consolidation

"on": [push, pull_request]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Apply staging cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {text.count(old)}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/datp_core/datasets/edge_iiotset/materialize.py",
              "@dataclass(frozen=True, slots=True)\nclass _EdgePublicationInputs:",
              "@dataclass(frozen=True, slots=True, eq=False)\nclass _EdgePublicationInputs:",
          )

          store_path = Path("src/datp_core/artifacts/store.py")
          store = store_path.read_text(encoding="utf-8")
          marker = """@dataclass(frozen=True, slots=True)
          class PublicationOutcome[ValueT]:
              status: PublicationStatus
              value: ValueT
              complete_digest: Checksum


          """.replace("          ", "")
          helpers = """@dataclass(frozen=True, slots=True)
          class PublicationOutcome[ValueT]:
              status: PublicationStatus
              value: ValueT
              complete_digest: Checksum


          def create_staging_directory(target: Path) -> Path:
              target.parent.mkdir(parents=True, exist_ok=True)
              return Path(mkdtemp(prefix=f".{target.name}.", dir=target.parent))


          def replace_directory(staging: Path, target: Path) -> None:
              if target.exists():
                  rmtree(target)
              staging.replace(target)


          def cleanup_staging_directory(staging: Path, *, ignore_errors: bool) -> None:
              if staging.exists():
                  rmtree(staging, ignore_errors=ignore_errors)


          """.replace("          ", "")
          if store.count(marker) != 1:
              raise SystemExit(f"store marker count: {store.count(marker)}")
          store = store.replace(marker, helpers, 1)
          store = store.replace(
              "        target.parent.mkdir(parents=True, exist_ok=True)\n"
              "        temporary = Path(mkdtemp(prefix=f\".{target.name}.\", dir=target.parent))",
              "        temporary = create_staging_directory(target)",
              1,
          )
          store = store.replace("            temporary.replace(target)", "            replace_directory(temporary, target)", 1)
          store = store.replace(
              "            rmtree(temporary, ignore_errors=True)",
              "            cleanup_staging_directory(temporary, ignore_errors=True)",
              1,
          )
          store_path.write_text(store, encoding="utf-8")

          def migrate(path: str, import_anchor: str, shared_import: str, helper_block: str, ignore_errors: bool) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(helper_block) != 1:
                  raise SystemExit(f"{path}: helper block count {text.count(helper_block)}")
              text = text.replace(helper_block, "", 1)
              text = text.replace("from os import replace as atomic_replace\n", "", 1)
              text = text.replace("from shutil import rmtree\n", "", 1)
              text = text.replace("from tempfile import mkdtemp\n", "", 1)
              if text.count(import_anchor) != 1:
                  raise SystemExit(f"{path}: import anchor count {text.count(import_anchor)}")
              text = text.replace(import_anchor, shared_import, 1)
              text = text.replace("_new_staging_directory(", "create_staging_directory(")
              text = text.replace("_replace_directory(", "replace_directory(")
              text = text.replace("_cleanup_staging(", "cleanup_staging_directory(")
              text = text.replace(
                  "cleanup_staging_directory(staging)",
                  f"cleanup_staging_directory(staging, ignore_errors={ignore_errors})",
              )
              file.write_text(text, encoding="utf-8")

          checkpoint_helpers = """
          def _new_staging_directory(target: Path) -> Path:
              target.parent.mkdir(parents=True, exist_ok=True)
              return Path(mkdtemp(prefix=f".{target.name}.", dir=target.parent))


          def _replace_directory(staging: Path, target: Path) -> None:
              if target.exists():
                  rmtree(target)
              atomic_replace(staging, target)


          def _cleanup_staging(staging: Path) -> None:
              if staging.exists():
                  rmtree(staging)
          """.replace("          ", "")
          migrate(
              "src/datp_core/learning/federated/checkpointing.py",
              "from datp_core.artifacts.serialization import serialize_json_model",
              "from datp_core.artifacts.serialization import serialize_json_model\n"
              "from datp_core.artifacts.store import (\n"
              "    cleanup_staging_directory,\n"
              "    create_staging_directory,\n"
              "    replace_directory,\n"
              ")",
              checkpoint_helpers,
              False,
          )

          scoring_helpers = """
          def _new_staging_directory(target: Path) -> Path:
              target.parent.mkdir(parents=True, exist_ok=True)
              return Path(mkdtemp(prefix=f".{target.name}.", dir=target.parent))


          def _replace_directory(staging: Path, target: Path) -> None:
              if target.exists():
                  rmtree(target)
              atomic_replace(staging, target)


          def _cleanup_staging(staging: Path) -> None:
              if staging.exists():
                  rmtree(staging, ignore_errors=True)
          """.replace("          ", "")
          migrate(
              "src/datp_core/scoring/generation.py",
              "from datp_core.artifacts.layout import scored_partition_roles",
              "from datp_core.artifacts.layout import scored_partition_roles\n"
              "from datp_core.artifacts.store import (\n"
              "    cleanup_staging_directory,\n"
              "    create_staging_directory,\n"
              "    replace_directory,\n"
              ")",
              scoring_helpers,
              True,
          )
          PY

      - name: Compile changed modules
        run: |
          python -m compileall -q \
            src/datp_core/artifacts/store.py \
            src/datp_core/datasets/edge_iiotset/materialize.py \
            src/datp_core/learning/federated/checkpointing.py \
            src/datp_core/scoring/generation.py

      - name: Commit cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "Centralize atomic directory staging"
          git push origin "HEAD:${GITHUB_REF_NAME}"
