name: Validate typed conformal ranks

"on": [push, pull_request]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Apply conformal rank typing
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re
          import subprocess

          values_path = Path("src/datp_core/domain/values.py")
          if "class ConformalRankIndex(" not in values_path.read_text(encoding="utf-8"):
              source_commit = "43f0de863b2d147f448acca6898b47db2282ed8f"
              subprocess.run(
                  ["git", "fetch", "origin", source_commit, "--depth=1"],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              workflow = subprocess.check_output(
                  ["git", "show", f"{source_commit}:.github/workflows/tests.yml"],
                  text=True,
              )
              start_marker = "          python - <<'PY'\n"
              start = workflow.index(start_marker) + len(start_marker)
              end = workflow.index("\n          PY", start)
              patch_script = dedent(workflow[start:end])
              exec(compile(patch_script, "conformal-rank-patch", "exec"), {})

              models_path = Path("src/datp_core/thresholding/models.py")
              models = models_path.read_text(encoding="utf-8")
              assignment = dedent('''
                  @dataclass(frozen=True, slots=True)
                  class ConformalAssignment:
                      """One client's finite-sample local conformal threshold."""

                      client: ClientIdentity
                      calibration_count: RowCount
                      rank_index: ConformalRankIndex
                      effective_quantile: Quantile
                      selected_score: ScoreValue
                      tie_count: RowCount
                      threshold: ThresholdValue

                      def __post_init__(self) -> None:
                          require_contract(
                              isinstance(self.rank_index, ConformalRankIndex),
                              "conformal rank index must use the typed rank contract",
                              ContractSubject.THRESHOLD,
                          )
                          require_contract(
                              self.rank_index.value <= self.calibration_count.value,
                              "conformal rank index must fall within the calibration sample",
                              ContractSubject.THRESHOLD,
                          )
                          require_contract(
                              floats_exactly_equal(self.threshold.value, self.selected_score.value),
                              "conformal threshold value must equal the selected score",
                              ContractSubject.THRESHOLD,
                          )
                          expected_quantile = self.rank_index.value / self.calibration_count.value
                          require_contract(
                              floats_absolutely_close(
                                  self.effective_quantile.value,
                                  expected_quantile,
                                  FRACTION_TOTAL_ABSOLUTE_TOLERANCE,
                              ),
                              "conformal effective quantile must equal rank_index / calibration_count",
                              ContractSubject.THRESHOLD,
                          )
              ''').lstrip()
              models, count = re.subn(
                  r"@dataclass\(frozen=True, slots=True\)\nclass ConformalAssignment:.*?"
                  r"(?=\n\n@dataclass\(frozen=True, slots=True\)\nclass ConformalThresholdResult:)",
                  assignment.rstrip(),
                  models,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(f"ConformalAssignment replacements: {count}")
              models_path.write_text(models, encoding="utf-8")
          PY

      - name: Compile changed modules
        run: |
          python -m compileall -q \
            src/datp_core/domain/values.py \
            src/datp_core/thresholding/quantiles.py \
            src/datp_core/thresholding/conformal.py \
            src/datp_core/thresholding/models.py \
            src/datp_core/evaluation/conformal_coverage.py

      - name: Run conformal rank tests
        run: |
          uv run pytest \
            tests/unit/thresholding/test_quantiles.py \
            tests/unit/thresholding/test_conformal.py \
            tests/unit/thresholding/test_models.py \
            tests/unit/evaluation/test_conformal_coverage.py \
            tests/property/test_quantile_monotonicity.py

      - name: Commit typed rank contracts
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Type finite-sample conformal rank indices"
          git push origin "HEAD:${GITHUB_REF_NAME}"
