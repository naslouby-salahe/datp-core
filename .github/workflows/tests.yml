name: Tests

"on": [push, pull_request]

permissions:
  contents: write

jobs:
  quality:
    name: Run quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Check formatting
        run: uv run ruff format --check src tests noxfile.py

      - name: Run Ruff
        run: uv run ruff check src tests noxfile.py

      - name: Run Pylint on changed Python contracts
        run: |
          uv run pylint --disable=import-outside-toplevel,too-few-public-methods src/datp_core/domain/values.py
          uv run pylint --disable=missing-module-docstring,missing-function-docstring,protected-access,redefined-outer-name,duplicate-code,too-many-lines,too-many-locals,too-many-statements,too-many-branches,too-many-arguments,too-many-positional-arguments,too-many-return-statements,too-many-public-methods,too-few-public-methods,unnecessary-lambda-assignment,import-outside-toplevel,no-member tests/pytest_cuda.py tests/unit/domain/test_values.py tests/unit/cli/test_preprocess_cli.py tests/unit/protocols/test_split_declarations.py

      - name: Run Pyright
        run: uv run pyright

      - name: Check import contracts
        run: uv run lint-imports

  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Provision empty raw-data root
        run: mkdir -p data/raw

      - name: Apply identity equality refactor
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              Path("src/datp_core/scoring/generation.py"): ("ClientScoringInput",),
              Path("src/datp_core/populations/models.py"): ("SplitConstructionRequest",),
              Path("src/datp_core/populations/integrity.py"): ("PopulationFinalizationRequest",),
              Path("src/datp_core/centralized_reference/training.py"): (
                  "CentralizedModelSnapshot",
                  "CentralizedTrainingRequest",
              ),
              Path("src/datp_core/learning/federated/models.py"): ("ClientTrainingInput",),
              Path("src/datp_core/learning/federated/training.py"): ("PreparedFederatedClientData",),
          }

          for path, class_names in targets.items():
              text = path.read_text(encoding="utf-8")
              for class_name in class_names:
                  old = f"@dataclass(frozen=True, slots=True)\nclass {class_name}:"
                  new = f"@dataclass(frozen=True, slots=True, eq=False)\nclass {class_name}:"
                  if new in text:
                      continue
                  if text.count(old) != 1:
                      raise SystemExit(f"expected exactly one mutable-payload dataclass boundary for {class_name}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      # The raw-source readiness audit below requires infrastructure a generic CI runner cannot
      # have: real licensed multi-GB datasets. It fails loudly by design rather than silently
      # downgrading; it is an environment-readiness check, not a portable unit test. CUDA-required
      # training and scoring tests are explicitly skipped when no CUDA device is present.
      - name: Run tests and collect coverage
        run: |
          uv run pytest \
            --ignore=tests/integration/configuration/test_raw_source_contracts_are_ready.py

      - name: Commit identity equality refactor
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/datp_core/scoring/generation.py \
            src/datp_core/populations/models.py \
            src/datp_core/populations/integrity.py \
            src/datp_core/centralized_reference/training.py \
            src/datp_core/learning/federated/models.py \
            src/datp_core/learning/federated/training.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix identity semantics for mutable payload dataclasses"
          git push origin "HEAD:${GITHUB_REF_NAME}"
