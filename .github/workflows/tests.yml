name: Repository model audit

"on": [push]

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Audit model contracts and duplication
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path("src/datp_core")
          files = tuple(sorted(ROOT.rglob("*.py")))
          trees = {path: ast.parse(path.read_text(encoding="utf-8"), filename=str(path)) for path in files}

          def decorator_call(node: ast.ClassDef) -> ast.Call | None:
              for decorator in node.decorator_list:
                  call = decorator if isinstance(decorator, ast.Call) else None
                  target = call.func if call else decorator
                  name = target.id if isinstance(target, ast.Name) else target.attr if isinstance(target, ast.Attribute) else ""
                  if name == "dataclass":
                      return call
              return None

          def keyword_bool(call: ast.Call | None, key: str, default: bool) -> bool:
              if call is None:
                  return default
              for keyword in call.keywords:
                  if keyword.arg == key and isinstance(keyword.value, ast.Constant):
                      return bool(keyword.value.value)
              return default

          def annotation_text(annotation: ast.expr) -> str:
              return ast.unparse(annotation)

          def location(path: Path, node: ast.AST) -> str:
              return f"{path}:{getattr(node, 'lineno', '?')}"

          explicit_any: list[str] = []
          primitive_domain_fields: list[str] = []
          mutable_frozen_fields: list[str] = []
          one_field_dataclasses: list[str] = []
          class_locations: dict[str, list[str]] = defaultdict(list)
          function_bodies: dict[str, list[str]] = defaultdict(list)
          string_dispatch: list[str] = []

          semantic_tokens = (
              "count", "index", "rank", "round", "seed", "threshold", "quantile", "coverage",
              "ratio", "bytes", "size", "fraction", "coefficient", "rate", "epoch", "batch",
              "worker", "support", "client_id", "group_id", "family_id", "checksum", "metric",
              "score", "variance", "mean", "error", "tolerance", "probability", "weight",
          )
          mutable_tokens = ("DataFrame", "LazyFrame", "ndarray", "Tensor", "dict[", "list[", "set[")
          primitive_annotations = {"int", "float", "str", "bool", "int | None", "float | None", "str | None", "bool | None"}

          for path, tree in trees.items():
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom):
                      if any(alias.name == "Any" for alias in node.names):
                          explicit_any.append(location(path, node))
                  elif isinstance(node, ast.Name) and node.id == "Any":
                      explicit_any.append(location(path, node))
                  elif isinstance(node, ast.Attribute) and node.attr == "Any":
                      explicit_any.append(location(path, node))
                  elif isinstance(node, ast.ClassDef):
                      class_locations[node.name].append(location(path, node))
                      call = decorator_call(node)
                      if call is None:
                          continue
                      fields = [item for item in node.body if isinstance(item, ast.AnnAssign) and isinstance(item.target, ast.Name)]
                      instance_fields = [
                          item for item in fields if not annotation_text(item.annotation).startswith("ClassVar[")
                      ]
                      if len(instance_fields) == 1:
                          field = instance_fields[0]
                          one_field_dataclasses.append(
                              f"{location(path, node)} {node.name}.{field.target.id}: {annotation_text(field.annotation)}"
                          )
                      frozen = keyword_bool(call, "frozen", False)
                      equality = keyword_bool(call, "eq", True)
                      for field in instance_fields:
                          name = field.target.id
                          annotation = annotation_text(field.annotation)
                          if annotation in primitive_annotations and any(token in name.lower() for token in semantic_tokens):
                              primitive_domain_fields.append(
                                  f"{location(path, field)} {node.name}.{name}: {annotation}"
                              )
                          if frozen and equality and any(token in annotation for token in mutable_tokens):
                              mutable_frozen_fields.append(
                                  f"{location(path, field)} {node.name}.{name}: {annotation}"
                              )
                  elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and not node.name.startswith("__"):
                      normalized = ast.dump(ast.Module(body=node.body, type_ignores=[]), include_attributes=False)
                      if len(normalized) >= 160:
                          digest = hashlib.sha256(normalized.encode()).hexdigest()
                          function_bodies[digest].append(f"{location(path, node)} {node.name}")
                  elif isinstance(node, ast.If):
                      rendered = ast.unparse(node.test)
                      if any(fragment in rendered for fragment in ('"family" in ', "'family' in ", '"cluster" in ', "'cluster' in ")):
                          string_dispatch.append(f"{location(path, node)} {rendered}")

          duplicate_classes = {
              name: places for name, places in class_locations.items() if len(places) > 1
          }
          duplicate_functions = [places for places in function_bodies.values() if len(places) > 1]

          sections = (
              ("EXPLICIT_ANY", sorted(set(explicit_any))),
              ("PRIMITIVE_DOMAIN_FIELDS", primitive_domain_fields),
              ("MUTABLE_FROZEN_EQUALITY", mutable_frozen_fields),
              ("ONE_FIELD_DATACLASSES", one_field_dataclasses),
              ("DUPLICATE_CLASS_NAMES", [f"{name}: {' | '.join(places)}" for name, places in sorted(duplicate_classes.items())]),
              ("DUPLICATE_FUNCTION_BODIES", [" | ".join(places) for places in duplicate_functions]),
              ("STRING_DRIVEN_DISPATCH", string_dispatch),
          )
          for title, findings in sections:
              print(f"\n=== {title} ({len(findings)}) ===")
              for finding in findings:
                  print(finding)
          PY
