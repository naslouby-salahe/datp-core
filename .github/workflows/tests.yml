name: Validate cardinality value contracts

"on": [push, pull_request]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Apply cardinality typing and checkpoint fix
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text and old not in text:
                  return text
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {text.count(old)}")
              return text.replace(old, new, 1)

          checkpoint_path = Path("src/datp_core/learning/federated/checkpointing.py")
          checkpoint = checkpoint_path.read_text(encoding="utf-8")
          if "from os import replace as atomic_replace\n" not in checkpoint:
              checkpoint = checkpoint.replace(
                  "from dataclasses import dataclass, replace\n",
                  "from dataclasses import dataclass, replace\nfrom os import replace as atomic_replace\n",
                  1,
              )
          checkpoint_path.write_text(checkpoint, encoding="utf-8")

          values_path = Path("src/datp_core/domain/values.py")
          values = values_path.read_text(encoding="utf-8")
          values = replace_once(
              values,
              "class LearningRate(PositiveFiniteFloatValue):",
              "class LogicalElementCount(PositiveIntegerValue):\n"
              "    validation_name: ClassVar[str] = \"logical element count\"\n\n\n"
              "class CudaDeviceCount(NonNegativeIntegerValue):\n"
              "    validation_name: ClassVar[str] = \"CUDA device count\"\n\n\n"
              "class ClientPublicationCount(NonNegativeIntegerValue):\n"
              "    validation_name: ClassVar[str] = \"client publication count\"\n\n\n"
              "class LearningRate(PositiveFiniteFloatValue):",
              "cardinality value insertion",
          )
          values_path.write_text(values, encoding="utf-8")

          communication_path = Path("src/datp_core/evaluation/communication.py")
          communication = communication_path.read_text(encoding="utf-8")
          communication = replace_once(
              communication,
              "from datp_core.domain.values import ByteCount, Seed",
              "from datp_core.domain.values import ByteCount, LogicalElementCount, Seed",
              "communication value import",
          )
          communication = replace_once(
              communication,
              "    logical_element_count: int",
              "    logical_element_count: LogicalElementCount",
              "payload logical count field",
          )
          communication, count = re.subn(
              r"    def __post_init__\(self\) -> None:\n"
              r"        if self\.logical_element_count < 1:\n"
              r"            raise ScientificContractError\(\"a communication payload requires at least one logical element\"\)",
              "    def __post_init__(self) -> None:\n"
              "        if not isinstance(self.logical_element_count, LogicalElementCount):\n"
              "            raise ScientificContractError(\"communication payloads require a typed logical element count\")",
              communication,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"payload logical count validation replacements: {count}")
          communication = replace_once(
              communication,
              "    total_logical_element_count: int",
              "    total_logical_element_count: LogicalElementCount",
              "diagnostic logical count field",
          )
          communication = replace_once(
              communication,
              "        expected_elements = sum(message.payload.logical_element_count for message in self.messages)",
              "        expected_elements = sum(message.payload.logical_element_count.value for message in self.messages)",
              "communication expected logical count",
          )
          communication = replace_once(
              communication,
              "            self.total_logical_element_count != expected_elements",
              "            self.total_logical_element_count.value != expected_elements",
              "communication total logical count validation",
          )
          communication = replace_once(
              communication,
              "        total_logical_element_count=sum(message.payload.logical_element_count for message in messages),",
              "        total_logical_element_count=LogicalElementCount(\n"
              "            sum(message.payload.logical_element_count.value for message in messages)\n"
              "        ),",
              "communication total logical count construction",
          )
          communication_path.write_text(communication, encoding="utf-8")

          communication_test_path = Path("tests/unit/evaluation/test_communication.py")
          communication_test = communication_test_path.read_text(encoding="utf-8")
          communication_test = replace_once(
              communication_test,
              "from datp_core.domain.values import Seed",
              "from datp_core.domain.values import LogicalElementCount, Seed",
              "communication test import",
          )
          communication_test = replace_once(
              communication_test,
              "SerializedPayloadEvidence(b\"abc\", 1)",
              "SerializedPayloadEvidence(b\"abc\", LogicalElementCount(1))",
              "valid communication payload test",
          )
          communication_test = replace_once(
              communication_test,
              'with pytest.raises(ScientificContractError, match="at least one"):',
              'with pytest.raises(ScientificContractError, match="typed logical element count"):',
              "invalid communication payload expectation",
          )
          communication_test = replace_once(
              communication_test,
              "        SerializedPayloadEvidence(b\"\", 0)",
              "        SerializedPayloadEvidence(b\"\", 0)  # type: ignore[arg-type]",
              "invalid communication payload construction",
          )
          communication_test_path.write_text(communication_test, encoding="utf-8")

          compute_path = Path("src/datp_core/runtime/compute.py")
          compute = compute_path.read_text(encoding="utf-8")
          compute = replace_once(
              compute,
              "from datp_core.domain.values import WorkerCount",
              "from datp_core.domain.values import CudaDeviceCount, WorkerCount",
              "CUDA count import",
          )
          compute = replace_once(compute, "    device_count: int", "    device_count: CudaDeviceCount", "CUDA count field")
          compute = replace_once(
              compute,
              "    device_count = torch.cuda.device_count() if available else 0",
              "    device_count = CudaDeviceCount(torch.cuda.device_count() if available else 0)",
              "CUDA count construction",
          )
          compute = replace_once(
              compute,
              "available and device_count > 0",
              "available and device_count.value > 0",
              "CUDA count condition",
          )
          compute_path.write_text(compute, encoding="utf-8")

          threshold_path = Path("src/datp_core/evaluation/threshold_estimation.py")
          threshold = threshold_path.read_text(encoding="utf-8")
          if "    SubsampleReplicateCount,\n" not in threshold:
              threshold = replace_once(
                  threshold,
                  "    Seed,\n",
                  "    Seed,\n    SubsampleReplicateCount,\n",
                  "subsample count import",
              )
          threshold = replace_once(
              threshold,
              "    replicate_count: int",
              "    replicate_count: SubsampleReplicateCount",
              "sample-efficiency replicate field",
          )
          threshold = replace_once(
              threshold,
              "        if self.replicate_count < 1 or self.threshold_variance_across_nested_replicates < 0:",
              "        if self.threshold_variance_across_nested_replicates < 0:",
              "sample-efficiency duplicate validation",
          )
          threshold = replace_once(
              threshold,
              "                replicate_count=len(replicate_group),",
              "                replicate_count=SubsampleReplicateCount(len(replicate_group)),",
              "sample-efficiency count construction",
          )
          threshold_path.write_text(threshold, encoding="utf-8")

          preprocess_path = Path("src/datp_core/orchestration/stages/preprocess_federated.py")
          preprocess = preprocess_path.read_text(encoding="utf-8")
          if "    ClientPublicationCount,\n" not in preprocess:
              preprocess = replace_once(
                  preprocess,
                  "    Checksum,\n",
                  "    Checksum,\n    ClientPublicationCount,\n",
                  "publication count import",
              )
          result_class = dedent('''
              @dataclass(frozen=True, slots=True)
              class PreprocessFederatedResult:
                  stage: ClassVar[StageOperationId] = StageOperationId.PREPROCESS_FEDERATED
                  population: PopulationId
                  dataset: DatasetId
                  partition_seed: Seed
                  split_protocol: SplitProtocolId
                  preprocessing_identity: PreprocessingProtocolId
                  client_publications: tuple[ClientPreprocessingResult, ...]
                  published_count: ClientPublicationCount
                  reused_count: ClientPublicationCount
                  execution_identity: ExternalTemporalExecutionIdentity | None = None

                  def __post_init__(self) -> None:
                      if not isinstance(self.published_count, ClientPublicationCount) or not isinstance(
                          self.reused_count, ClientPublicationCount
                      ):
                          raise TypeError("preprocessing results require typed publication counts")
                      if self.published_count.value + self.reused_count.value != len(self.client_publications):
                          raise ValueError("published and reused counts must cover every client publication")
          ''').lstrip()
          preprocess, count = re.subn(
              r"@dataclass\(frozen=True, slots=True\)\nclass PreprocessFederatedResult:.*?"
              r"(?=\n\n@dataclass\(frozen=True, slots=True\)\nclass PreprocessFederatedArtifactsRequest:)",
              result_class.rstrip(),
              preprocess,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"PreprocessFederatedResult replacements: {count}")
          preprocess = preprocess.replace(
              "        published_count=published_count,",
              "        published_count=ClientPublicationCount(published_count),",
          )
          preprocess = preprocess.replace(
              "        reused_count=reused_count,",
              "        reused_count=ClientPublicationCount(reused_count),",
          )
          if preprocess.count("published_count=ClientPublicationCount(published_count)") != 3:
              raise SystemExit("not every preprocessing result wraps published_count")
          if preprocess.count("reused_count=ClientPublicationCount(reused_count)") != 3:
              raise SystemExit("not every preprocessing result wraps reused_count")
          preprocess_path.write_text(preprocess, encoding="utf-8")
          PY

      - name: Compile changed modules
        run: |
          python -m compileall -q \
            src/datp_core/domain/values.py \
            src/datp_core/evaluation/communication.py \
            src/datp_core/evaluation/threshold_estimation.py \
            src/datp_core/runtime/compute.py \
            src/datp_core/orchestration/stages/preprocess_federated.py \
            src/datp_core/learning/federated/checkpointing.py

      - name: Run full regression suite
        run: |
          mkdir -p data/raw
          uv run pytest --ignore=tests/integration/configuration/test_raw_source_contracts_are_ready.py

      - name: Commit cardinality contracts
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Type remaining runtime cardinality contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
