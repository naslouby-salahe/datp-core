name: Tests

"on": [push, pull_request]

permissions:
  contents: write

jobs:
  quality:
    name: Run quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Check formatting
        run: uv run ruff format --check src tests noxfile.py

      - name: Run Ruff
        run: uv run ruff check src tests noxfile.py

      - name: Run Pylint on changed Python contracts
        run: |
          uv run pylint --disable=import-outside-toplevel,too-few-public-methods src/datp_core/domain/values.py
          uv run pylint --disable=missing-module-docstring,missing-function-docstring,protected-access,redefined-outer-name,duplicate-code,too-many-lines,too-many-locals,too-many-statements,too-many-branches,too-many-arguments,too-many-positional-arguments,too-many-return-statements,too-many-public-methods,too-few-public-methods,unnecessary-lambda-assignment,import-outside-toplevel,no-member tests/pytest_cuda.py tests/unit/domain/test_values.py tests/unit/cli/test_preprocess_cli.py tests/unit/protocols/test_split_declarations.py

      - name: Run Pyright
        run: uv run pyright

      - name: Check import contracts
        run: uv run lint-imports

  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Provision empty raw-data root
        run: mkdir -p data/raw

      - name: Apply final typed-model cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/datp_core/analysis/inference/bootstrap.py",
              "@dataclass(frozen=True, slots=True)\nclass _BootstrapDistribution:",
              "@dataclass(frozen=True, slots=True, eq=False)\nclass _BootstrapDistribution:",
          )

          replace_once(
              "src/datp_core/centralized_reference/training.py",
              "from datp_core.learning.autoencoder import ReconstructionAutoencoder",
              "from datp_core.learning.autoencoder import (\n"
              "    AutoencoderState,\n"
              "    AutoencoderStateView,\n"
              "    ReconstructionAutoencoder,\n"
              ")",
          )
          replace_once(
              "src/datp_core/centralized_reference/training.py",
              "    state_dict: dict[str, torch.Tensor]",
              "    state_dict: AutoencoderState",
          )
          replace_once(
              "src/datp_core/centralized_reference/training.py",
              "def persist_state_dict_tensors(state_dict: dict[str, torch.Tensor], path: Path) -> Checksum:",
              "def persist_state_dict_tensors(state_dict: AutoencoderStateView, path: Path) -> Checksum:",
          )

          replace_once(
              "src/datp_core/populations/models.py",
              "    observed_eligible_group_count: int",
              "    observed_eligible_group_count: ClientCount",
          )
          replace_once(
              "src/datp_core/populations/models.py",
              "        if self.observed_eligible_group_count != len(self.eligible_group_ids):",
              "        if self.observed_eligible_group_count.value != len(self.eligible_group_ids):",
          )
          replace_once(
              "src/datp_core/populations/models.py",
              "            self.observed_eligible_group_count,",
              "            self.observed_eligible_group_count.value,",
          )
          replace_once(
              "src/datp_core/populations/models.py",
              "    observed_client_count: int",
              "    observed_client_count: ClientCount",
          )
          replace_once(
              "src/datp_core/populations/models.py",
              "    def __post_init__(self) -> None:\n"
              "        if self.observed_client_count < 0:\n"
              "            raise ValueError(\"observed client count must be non-negative\")\n"
              "        if not self.evidence:\n",
              "    def __post_init__(self) -> None:\n"
              "        if not self.evidence:\n",
          )
          replace_once(
              "src/datp_core/populations/integrity.py",
              "        accepted_n,\n        \"candidate and accepted client sets match the locked construction contract\",",
              "        ClientCount(accepted_n),\n        \"candidate and accepted client sets match the locked construction contract\",",
          )
          replace_once(
              "src/datp_core/populations/integrity.py",
              "    return PopulationFeasibility(PopulationFeasibilityStatus.INFEASIBLE, reason, expected, observed, evidence)",
              "    return PopulationFeasibility(\n"
              "        PopulationFeasibilityStatus.INFEASIBLE, reason, expected, ClientCount(observed), evidence\n"
              "    )",
          )
          replace_once(
              "src/datp_core/orchestration/stages/preprocess_federated.py",
              "            observed_client_count=len(document.accepted_clients),",
              "            observed_client_count=ClientCount(len(document.accepted_clients)),",
          )
          replace_once(
              "src/datp_core/populations/edge_temporal_groups.py",
              "        observed_eligible_group_count=len(eligible_ids),",
              "        observed_eligible_group_count=ClientCount(len(eligible_ids)),",
          )
          replace_once(
              "tests/unit/populations/test_edge_temporal_groups.py",
              "from datp_core.domain.values import Seed",
              "from datp_core.domain.values import ClientCount, Seed",
          )
          replace_once(
              "tests/unit/populations/test_edge_temporal_groups.py",
              "    assert diagnostics.observed_eligible_group_count == 0",
              "    assert diagnostics.observed_eligible_group_count == ClientCount(0)",
          )
          replace_once(
              "tests/unit/populations/test_edge_temporal_groups.py",
              "    assert diagnostics.observed_eligible_group_count == 9",
              "    assert diagnostics.observed_eligible_group_count == ClientCount(9)",
          )

          models_path = Path("src/datp_core/thresholding/models.py")
          models = models_path.read_text(encoding="utf-8")
          old_conformal = '''@dataclass(frozen=True, slots=True)
          class ConformalThresholdResult:
              """`LOCAL_CONFORMAL_THRESHOLD`: finite-sample local conformal thresholds."""

              coordinate: FederatedTrainingCoordinate
              coverage: CoverageTarget
              significance: Ratio
              eligible_clients: tuple[ClientIdentity, ...]
              assignments: tuple[ConformalAssignment, ...]
              unavailable_clients: tuple[ClientIdentity, ...]
              method: ClassVar[FederatedThresholdMethod] = FederatedThresholdMethod.LOCAL_CONFORMAL_THRESHOLD

              def __post_init__(self) -> None:
                  require_contract(
                      floats_absolutely_close(
                          self.coverage.value + self.significance.value, 1.0, FRACTION_TOTAL_ABSOLUTE_TOLERANCE
                      ),
                      "conformal coverage and significance must be complements",
                      ContractSubject.THRESHOLD,
                  )
                  require_contract(
                      bool(self.assignments),
                      "a conformal threshold result requires at least one assigned client",
                      ContractSubject.THRESHOLD,
                  )
                  _validate_client_partition(
                      self.eligible_clients, tuple(a.client for a in self.assignments), self.unavailable_clients
                  )
          '''.replace("          ", "")
          new_conformal = '''@dataclass(frozen=True, slots=True)
          class ConformalThresholdResult:
              """`LOCAL_CONFORMAL_THRESHOLD`: finite-sample local conformal thresholds."""

              coordinate: FederatedTrainingCoordinate
              coverage: CoverageTarget
              eligible_clients: tuple[ClientIdentity, ...]
              assignments: tuple[ConformalAssignment, ...]
              unavailable_clients: tuple[ClientIdentity, ...]
              method: ClassVar[FederatedThresholdMethod] = FederatedThresholdMethod.LOCAL_CONFORMAL_THRESHOLD

              def __post_init__(self) -> None:
                  require_contract(
                      0.0 < self.coverage.value <= 1.0,
                      "conformal coverage must be in (0, 1]",
                      ContractSubject.THRESHOLD,
                  )
                  require_contract(
                      bool(self.assignments),
                      "a conformal threshold result requires at least one assigned client",
                      ContractSubject.THRESHOLD,
                  )
                  _validate_client_partition(
                      self.eligible_clients, tuple(a.client for a in self.assignments), self.unavailable_clients
                  )

              @property
              def significance(self) -> Ratio:
                  """Conformal miscoverage derived from the single authoritative coverage target."""
                  return Ratio(1.0 - self.coverage.value)
          '''.replace("          ", "")
          if old_conformal not in models:
              if new_conformal not in models:
                  raise SystemExit("conformal result block did not match")
          else:
              models = models.replace(old_conformal, new_conformal, 1)

          old_payload = '''@dataclass(frozen=True, slots=True)
          class CommunicationPayload:
              """Estimated (not measured) serialized byte size of one round of communicated fields."""

              fields: ClassVar[tuple[str, ...]] = ("count", "mean", "variance")
              estimated_bytes: ByteCount


          '''.replace("          ", "")
          if old_payload in models:
              models = models.replace(old_payload, "", 1)
          elif "class CommunicationPayload:" in models:
              raise SystemExit("communication payload block did not match")
          if "    communication_payload: CommunicationPayload" in models:
              models = models.replace(
                  "    communication_payload: CommunicationPayload",
                  "    estimated_communication_bytes: ByteCount",
                  1,
              )
          elif "    estimated_communication_bytes: ByteCount" not in models:
              raise SystemExit("federated statistics communication field did not match")
          models_path.write_text(models, encoding="utf-8")

          conformal_path = Path("src/datp_core/thresholding/conformal.py")
          conformal = conformal_path.read_text(encoding="utf-8")
          conformal = conformal.replace(
              "from datp_core.domain.values import CoverageTarget, Quantile, Ratio, RowCount, ScoreValue",
              "from datp_core.domain.values import CoverageTarget, Quantile, RowCount, ScoreValue",
              1,
          )
          conformal = conformal.replace("    significance = Ratio(1.0 - coverage_value)\n", "", 1)
          conformal = conformal.replace("        significance=significance,\n", "", 1)
          conformal_path.write_text(conformal, encoding="utf-8")

          stats_path = Path("src/datp_core/thresholding/federated_benign_statistics.py")
          stats = stats_path.read_text(encoding="utf-8")
          stats = stats.replace("    CommunicationPayload,\n", "", 1)
          stats = stats.replace(
              "    communication_payload = CommunicationPayload(estimated_bytes=_serialized_payload_bytes(summaries))",
              "    estimated_communication_bytes = _serialized_payload_bytes(summaries)",
              1,
          )
          stats = stats.replace(
              "        communication_payload=communication_payload,",
              "        estimated_communication_bytes=estimated_communication_bytes,",
              1,
          )
          stats_path.write_text(stats, encoding="utf-8")

          test_models_path = Path("tests/unit/thresholding/test_models.py")
          test_models = test_models_path.read_text(encoding="utf-8")
          test_models = test_models.replace("    CommunicationPayload,\n", "", 1)
          test_models = re.sub(r"^\s+significance=Ratio\([^\n]+\),\n", "", test_models, flags=re.MULTILINE)
          old_payload_test = '''def test_communication_payload_declares_fixed_fields() -> None:
              payload = CommunicationPayload(estimated_bytes=ByteCount(10))
              assert payload.fields == ("count", "mean", "variance")
              assert payload.estimated_bytes == ByteCount(10)


          '''.replace("          ", "")
          new_significance_test = '''def test_conformal_significance_is_derived_from_coverage() -> None:
              result = ConformalThresholdResult(
                  coordinate=COORDINATE,
                  coverage=CoverageTarget(0.95),
                  eligible_clients=(CLIENT_A,),
                  assignments=(
                      ConformalAssignment(
                          client=CLIENT_A,
                          calibration_count=RowCount(20),
                          rank_index=19,
                          effective_quantile=Quantile(0.95),
                          selected_score=ScoreValue(1.0),
                          tie_count=RowCount(1),
                          threshold=ThresholdValue(1.0),
                      ),
                  ),
                  unavailable_clients=(),
              )
              assert result.significance == Ratio(0.05)


          '''.replace("          ", "")
          if old_payload_test in test_models:
              test_models = test_models.replace(old_payload_test, new_significance_test, 1)
          elif "def test_conformal_significance_is_derived_from_coverage" not in test_models:
              raise SystemExit("communication payload test did not match")
          test_models = test_models.replace(
              "            communication_payload=CommunicationPayload(estimated_bytes=ByteCount(10)),",
              "            estimated_communication_bytes=ByteCount(10),",
              1,
          )
          test_models_path.write_text(test_models, encoding="utf-8")

          stats_test_path = Path("tests/unit/thresholding/test_federated_benign_statistics.py")
          stats_test = stats_test_path.read_text(encoding="utf-8")
          old_stats_test = '''def test_communication_payload_only_declares_count_mean_variance() -> None:
              clients = _homogeneous_clients()
              result = construct_federated_benign_statistics(clients, FEDERATED_STATISTICS_PROTOCOL, QUANTILE)
              assert result.communication_payload.fields == ("count", "mean", "variance")
              assert result.communication_payload.estimated_bytes.value > 0
          '''.replace("          ", "")
          new_stats_test = '''def test_estimated_communication_bytes_are_reported_directly() -> None:
              clients = _homogeneous_clients()
              result = construct_federated_benign_statistics(clients, FEDERATED_STATISTICS_PROTOCOL, QUANTILE)
              assert result.estimated_communication_bytes.value > 0
          '''.replace("          ", "")
          if old_stats_test in stats_test:
              stats_test = stats_test.replace(old_stats_test, new_stats_test, 1)
          elif "def test_estimated_communication_bytes_are_reported_directly" not in stats_test:
              raise SystemExit("federated statistics communication test did not match")
          stats_test_path.write_text(stats_test, encoding="utf-8")
          PY

      # The raw-source readiness audit below requires infrastructure a generic CI runner cannot
      # have: real licensed multi-GB datasets. It fails loudly by design rather than silently
      # downgrading; it is an environment-readiness check, not a portable unit test. CUDA-required
      # training and scoring tests are explicitly skipped when no CUDA device is present.
      - name: Run tests and collect coverage
        run: |
          uv run pytest \
            --ignore=tests/integration/configuration/test_raw_source_contracts_are_ready.py

      - name: Commit final typed-model cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finish typed model contract cleanup"
          git push origin "HEAD:${GITHUB_REF_NAME}"
