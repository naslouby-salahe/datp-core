name: Apply atomic staging consolidation

"on": [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/consolidate-dataclass-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Consolidate staging lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {text.count(old)}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/datp_core/datasets/edge_iiotset/materialize.py",
              "@dataclass(frozen=True, slots=True)\nclass _EdgePublicationInputs:",
              "@dataclass(frozen=True, slots=True, eq=False)\nclass _EdgePublicationInputs:",
          )

          store_path = Path("src/datp_core/artifacts/store.py")
          store = store_path.read_text(encoding="utf-8")
          marker = '''@dataclass(frozen=True, slots=True)
          class PublicationOutcome[ValueT]:
              status: PublicationStatus
              value: ValueT
              complete_digest: Checksum


          '''.replace("          ", "")
          replacement = '''@dataclass(frozen=True, slots=True)
          class PublicationOutcome[ValueT]:
              status: PublicationStatus
              value: ValueT
              complete_digest: Checksum


          def create_staging_directory(target: Path) -> Path:
              """Create one sibling staging directory for an atomic directory publication."""
              target.parent.mkdir(parents=True, exist_ok=True)
              return Path(mkdtemp(prefix=f".{target.name}.", dir=target.parent))


          def replace_directory(staging: Path, target: Path) -> None:
              """Replace a complete target directory with a prepared staging directory."""
              if target.exists():
                  rmtree(target)
              staging.replace(target)


          def cleanup_staging_directory(staging: Path, *, ignore_errors: bool) -> None:
              """Remove a staging directory under explicitly selected cleanup semantics."""
              if staging.exists():
                  rmtree(staging, ignore_errors=ignore_errors)


          '''.replace("          ", "")
          if store.count(marker) != 1:
              raise SystemExit("publication outcome insertion point did not match")
          store = store.replace(marker, replacement, 1)
          store = store.replace(
              "        target.parent.mkdir(parents=True, exist_ok=True)\n"
              "        temporary = Path(mkdtemp(prefix=f\".{target.name}.\", dir=target.parent))",
              "        temporary = create_staging_directory(target)",
              1,
          )
          store = store.replace("            temporary.replace(target)", "            replace_directory(temporary, target)", 1)
          store = store.replace(
              "            rmtree(temporary, ignore_errors=True)",
              "            cleanup_staging_directory(temporary, ignore_errors=True)",
              1,
          )
          store_path.write_text(store, encoding="utf-8")

          checkpoint_path = Path("src/datp_core/learning/federated/checkpointing.py")
          checkpoint = checkpoint_path.read_text(encoding="utf-8")
          old_helpers = '''
          def _new_staging_directory(target: Path) -> Path:
              target.parent.mkdir(parents=True, exist_ok=True)
              return Path(mkdtemp(prefix=f".{target.name}.", dir=target.parent))


          def _replace_directory(staging: Path, target: Path) -> None:
              if target.exists():
                  rmtree(target)
              atomic_replace(staging, target)


          def _cleanup_staging(staging: Path) -> None:
              if staging.exists():
                  rmtree(staging)
          '''.replace("          ", "")
          if checkpoint.count(old_helpers) != 1:
              raise SystemExit("checkpointing helper block did not match")
          checkpoint = checkpoint.replace(old_helpers, "", 1)
          checkpoint = checkpoint.replace("from os import replace as atomic_replace\n", "", 1)
          checkpoint = checkpoint.replace("from shutil import rmtree\n", "", 1)
          checkpoint = checkpoint.replace("from tempfile import mkdtemp\n", "", 1)
          checkpoint = checkpoint.replace(
              "from datp_core.artifacts.serialization import serialize_json_model",
              "from datp_core.artifacts.serialization import serialize_json_model\n"
              "from datp_core.artifacts.store import (\n"
              "    cleanup_staging_directory,\n"
              "    create_staging_directory,\n"
              "    replace_directory,\n"
              ")",
              1,
          )
          checkpoint = checkpoint.replace("_new_staging_directory(", "create_staging_directory(")
          checkpoint = checkpoint.replace("_replace_directory(", "replace_directory(")
          checkpoint = checkpoint.replace("_cleanup_staging(", "cleanup_staging_directory(")
          checkpoint = checkpoint.replace(
              "cleanup_staging_directory(staging)",
              "cleanup_staging_directory(staging, ignore_errors=False)",
          )
          checkpoint_path.write_text(checkpoint, encoding="utf-8")

          scoring_path = Path("src/datp_core/scoring/generation.py")
          scoring = scoring_path.read_text(encoding="utf-8")
          old_helpers = '''
          def _new_staging_directory(target: Path) -> Path:
              target.parent.mkdir(parents=True, exist_ok=True)
              return Path(mkdtemp(prefix=f".{target.name}.", dir=target.parent))


          def _replace_directory(staging: Path, target: Path) -> None:
              if target.exists():
                  rmtree(target)
              atomic_replace(staging, target)


          def _cleanup_staging(staging: Path) -> None:
              if staging.exists():
                  rmtree(staging, ignore_errors=True)
          '''.replace("          ", "")
          if scoring.count(old_helpers) != 1:
              raise SystemExit("scoring helper block did not match")
          scoring = scoring.replace(old_helpers, "", 1)
          scoring = scoring.replace("from os import replace as atomic_replace\n", "", 1)
          scoring = scoring.replace("from shutil import rmtree\n", "", 1)
          scoring = scoring.replace("from tempfile import mkdtemp\n", "", 1)
          scoring = scoring.replace(
              "from datp_core.artifacts.layout import scored_partition_roles",
              "from datp_core.artifacts.layout import scored_partition_roles\n"
              "from datp_core.artifacts.store import (\n"
              "    cleanup_staging_directory,\n"
              "    create_staging_directory,\n"
              "    replace_directory,\n"
              ")",
              1,
          )
          scoring = scoring.replace("_new_staging_directory(", "create_staging_directory(")
          scoring = scoring.replace("_replace_directory(", "replace_directory(")
          scoring = scoring.replace("_cleanup_staging(", "cleanup_staging_directory(")
          scoring = scoring.replace(
              "cleanup_staging_directory(staging)",
              "cleanup_staging_directory(staging, ignore_errors=True)",
          )
          scoring_path.write_text(scoring, encoding="utf-8")
          PY

      - name: Run full test suite
        run: |
          mkdir -p data/raw
          uv run pytest --ignore=tests/integration/configuration/test_raw_source_contracts_are_ready.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "Centralize atomic directory staging"
          git push origin "HEAD:${GITHUB_REF_NAME}"
