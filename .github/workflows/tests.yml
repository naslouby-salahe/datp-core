name: Diagnose publication cleanup

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Inspect transformation targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          checks = {
              "edge dataclass": ("src/datp_core/datasets/edge_iiotset/materialize.py", "@dataclass(frozen=True, slots=True)\nclass _EdgePublicationInputs:"),
              "store outcome": ("src/datp_core/artifacts/store.py", "@dataclass(frozen=True, slots=True)\nclass PublicationOutcome[ValueT]:"),
              "checkpoint helper start": ("src/datp_core/learning/federated/checkpointing.py", "def _new_staging_directory(target: Path) -> Path:"),
              "checkpoint helper end": ("src/datp_core/learning/federated/checkpointing.py", "def _cleanup_staging(staging: Path) -> None:"),
              "scoring helper start": ("src/datp_core/scoring/generation.py", "def _new_staging_directory(target: Path) -> Path:"),
              "scoring helper end": ("src/datp_core/scoring/generation.py", "def _cleanup_staging(staging: Path) -> None:"),
              "central confusion": ("src/datp_core/centralized_reference/evaluation.py", "class ConfusionCounts:"),
              "central validation": ("src/datp_core/centralized_reference/evaluation.py", "    def __post_init__(self) -> None:\n        for name, value in ("),
              "central rate": ("src/datp_core/centralized_reference/evaluation.py", "def _rate_metric(metric: MetricId, numerator: int, denominator: int) -> CentralizedMetricRecord:"),
          }
          for label, (path, pattern) in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              print(f"{label}: {text.count(pattern)}")

          for path in (
              "src/datp_core/learning/federated/checkpointing.py",
              "src/datp_core/scoring/generation.py",
          ):
              text = Path(path).read_text(encoding="utf-8")
              renamed = text.replace("_new_staging_directory(", "create_staging_directory(")
              renamed = renamed.replace("_replace_directory(", "replace_directory(")
              strict = "checkpointing" in path
              renamed = re.sub(
                  r"_cleanup_staging\(([^\n)]+)\)",
                  rf"cleanup_staging_directory(\1, ignore_errors={'False' if strict else 'True'})",
                  renamed,
              )
              suffix = "persist_federated_training_history" if strict else "_write_complete_marker"
              ignore = "False" if strict else "True"
              pattern = (
                  r"\ndef create_staging_directory\(target: Path\) -> Path:.*?"
                  rf"\ndef cleanup_staging_directory\(staging: Path, ignore_errors={ignore}\) -> None:.*?"
                  rf"(?=\n\ndef {suffix})"
              )
              print(f"{path} transformed helper matches: {len(re.findall(pattern, renamed, flags=re.DOTALL))}")
          PY
