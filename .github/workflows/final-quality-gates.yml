name: Final Phase 16 quality gates

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/final-quality-gates.yml
      - src/**
      - tests/**
      - pyproject.toml
      - .pylintrc
      - .importlinter

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - run: uv sync --all-groups --all-extras --frozen

      - id: format
        name: Ruff format check
        continue-on-error: true
        run: uv run ruff format --check src tests noxfile.py

      - id: ruff
        name: Ruff lint
        continue-on-error: true
        run: uv run ruff check src tests noxfile.py

      - id: pyright
        name: Pyright
        continue-on-error: true
        run: uv run pyright

      - id: pylint_source
        name: Pylint source
        continue-on-error: true
        run: uv run pylint src

      - id: pylint_tests
        name: Pylint tests
        continue-on-error: true
        run: uv run pylint --disable=missing-module-docstring,too-few-public-methods,use-implicit-booleaness-not-comparison tests

      - id: imports
        name: Import architecture
        continue-on-error: true
        run: uv run lint-imports

      - id: e2e
        name: End-to-end acceptance
        continue-on-error: true
        run: uv run pytest tests/e2e -q

      - name: Enforce aggregate quality verdict
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          PYRIGHT: ${{ steps.pyright.outcome }}
          PYLINT_SOURCE: ${{ steps.pylint_source.outcome }}
          PYLINT_TESTS: ${{ steps.pylint_tests.outcome }}
          IMPORTS: ${{ steps.imports.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          python - <<'PY'
          import os
          import sys

          outcomes = {
              "format": os.environ["FORMAT"],
              "ruff": os.environ["RUFF"],
              "pyright": os.environ["PYRIGHT"],
              "pylint_source": os.environ["PYLINT_SOURCE"],
              "pylint_tests": os.environ["PYLINT_TESTS"],
              "imports": os.environ["IMPORTS"],
              "e2e": os.environ["E2E"],
          }
          failures = tuple(name for name, outcome in outcomes.items() if outcome != "success")
          print(outcomes)
          sys.exit(1 if failures else 0)
          PY
