name: Final Phase 16 quality gates

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/final-quality-gates.yml
      - src/**
      - tests/**
      - pyproject.toml
      - .pylintrc
      - .importlinter

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - run: uv sync --all-groups --all-extras --frozen

      - name: Ruff format check
        run: uv run ruff format --check src tests noxfile.py

      - name: Ruff lint
        run: uv run ruff check src tests noxfile.py

      - name: Pyright
        run: uv run pyright

      - name: Pylint source
        run: uv run pylint src

      - name: Pylint tests
        run: uv run pylint --disable=missing-module-docstring,too-few-public-methods,use-implicit-booleaness-not-comparison tests

      - name: Import architecture
        run: uv run lint-imports

      - name: End-to-end acceptance
        run: uv run pytest tests/e2e -q
