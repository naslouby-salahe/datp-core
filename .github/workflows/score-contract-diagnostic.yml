name: Score contract diagnostic

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/score-contract-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --dev
      - name: Run focused score contract tests
        run: |
          uv run pytest -vv -x \
            tests/unit/evaluation/test_controls.py::test_build_federated_evaluation_inputs_from_manifest \
            tests/scientific/test_fixed_detector_contract.py::test_every_threshold_method_receives_identical_detector_provenance
      - name: Remove diagnostic workflow
        if: always()
        run: |
          rm .github/workflows/score-contract-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-shot score contract diagnostic"
          git push origin HEAD:agent/phase-12-16-target-architecture
