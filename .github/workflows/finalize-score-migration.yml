name: Finalize score migration

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/finalize-score-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0

      - name: Apply exact migration
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()
          replacements = {
              "from datp_core.scoring.models import": "from datp_core.protocols.inference import",
              "from datp_core.scoring.generation import": "from datp_core.pipeline.scoring.service import",
          }
          for path in sorted((*root.joinpath("src").rglob("*.py"), *root.joinpath("tests").rglob("*.py"))):
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          enum_test = root / "tests/unit/domain/test_enums.py"
          text = enum_test.read_text(encoding="utf-8")
          text = text.replace("    StageOperationId,\n", "")
          block_start = text.index("    (\n        StageOperationId,")
          block_end = text.index("    (\n        SplitId,", block_start)
          text = text[:block_start] + text[block_end:]
          obsolete_test = '''\ndef test_stage_operation_id_exhaustively_covers_existing_stage_files() -> None:\n    stages_root = Path(__file__).parents[3] / "src" / "datp_core" / "orchestration" / "stages"\n    stage_files = frozenset(path.stem for path in stages_root.glob("*.py") if path.stem != "__init__")\n    assert {stage.value for stage in StageOperationId} == stage_files\n\n'''
          if obsolete_test not in text:
              raise SystemExit("obsolete stage-operation test did not match exactly")
          text = text.replace(obsolete_test, "\n")
          enum_test.write_text(text, encoding="utf-8")

          for path in (
              root / "src/datp_core/scoring/__init__.py",
              root / "src/datp_core/scoring/models.py",
              root / "src/datp_core/scoring/generation.py",
          ):
              path.unlink()
          (root / "src/datp_core/scoring").rmdir()

          stale = []
          for path in sorted((*root.joinpath("src").rglob("*.py"), *root.joinpath("tests").rglob("*.py"))):
              if "datp_core.scoring" in path.read_text(encoding="utf-8"):
                  stale.append(str(path.relative_to(root)))
          if stale:
              raise SystemExit(f"stale score imports remain: {stale}")

          workflow = root / ".github/workflows/finalize-score-migration.yml"
          workflow.unlink()

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize score ownership migration"
          git push origin HEAD:agent/phase-12-16-target-architecture
