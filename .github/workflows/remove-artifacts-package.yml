name: Remove residual artifacts package

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/remove-artifacts-package.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Extract and execute reviewed migration
        run: |
          cp src/datp_core/artifacts/store.py /tmp/preprocessing_publication.py
          git show 5008cea7c49a93315fc00ab04e0463b960164cbc:.github/workflows/remove-artifacts-package.yml \
            | awk '/^          python <<'"'"'PY'"'"'$/{capture=1; next} /^          PY$/{capture=0} capture{sub(/^          /, ""); print}' \
            > /tmp/remove_artifacts_package.py
          test -s /tmp/remove_artifacts_package.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/remove_artifacts_package.py')
          text = path.read_text(encoding='utf-8')
          old = "if 'datp_core.artifacts' in path.read_text(encoding='utf-8'):\n"
          new = (
              "if (\n"
              "    path != root / 'tests/architecture/test_architecture_ratchets.py'\n"
              "    and 'datp_core.artifacts' in path.read_text(encoding='utf-8')\n"
              "):\n"
          )
          if text.count(old) != 1:
              raise SystemExit('stale-import assertion patch did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python /tmp/remove_artifacts_package.py
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/preprocessing_publication.py')
          destination = Path('src/datp_core/preprocessing/publication.py')
          text = source.read_text(encoding='utf-8')
          old = (
              'from datp_core.artifacts.completion import complete_digest\n'
              'from datp_core.artifacts.layout import ProcessedAssetName\n'
              'from datp_core.artifacts.serialization import canonical_json_text\n'
          )
          new = (
              'from datp_core.domain.provenance import canonical_json_text\n'
              'from datp_core.domain.values import Checksum, checksum_text\n'
              'from datp_core.preprocessing.contracts import ProcessedAssetName\n\n\n'
              'def complete_digest(manifest_payload: str, schema_payload: str) -> Checksum:\n'
              '    return checksum_text(f"{manifest_payload}\\n{schema_payload}")\n'
          )
          if text.count(old) != 1:
              raise SystemExit('tested store import block did not match exactly once')
          destination.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - run: uv sync --all-groups --all-extras --frozen
      - run: uv run ruff format src tests noxfile.py
      - run: uv run ruff check src tests noxfile.py
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest tests/architecture tests/unit/preprocessing tests/integration/preprocessing -q
      - run: uv run pytest -q

      - name: Commit migration without force-updating concurrent work
        run: |
          set -euo pipefail
          branch='agent/phase-12-16-target-architecture'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove residual artifact ownership package'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            git pull --rebase origin "$branch"
          done
          exit 1
