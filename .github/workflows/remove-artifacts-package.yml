name: Remove residual artifacts package

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/remove-artifacts-package.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Migrate every artifact owner
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          publication = root / 'src/datp_core/preprocessing/publication.py'
          if publication.exists():
              raise SystemExit('preprocessing publication owner already exists')
          publication.write_text('''"""Atomic publication and reload validation for fitted preprocessing outputs."""

from collections.abc import Callable
from dataclasses import dataclass
from pathlib import Path
from shutil import rmtree
from tempfile import mkdtemp

from filelock import FileLock
from pydantic import BaseModel, ValidationError

from datp_core.domain.enums import ContractSubject, PublicationStatus
from datp_core.domain.errors import ArtifactIntegrityError
from datp_core.domain.provenance import canonical_json_text
from datp_core.domain.values import Checksum, checksum_text
from datp_core.preprocessing.contracts import ProcessedAssetName


@dataclass(frozen=True, slots=True)
class ProcessedPublication[ManifestT: BaseModel, SchemaT: BaseModel, ReportT: BaseModel]:
    coordinate_directory: Path
    manifest: ManifestT
    schema: SchemaT
    writer: Callable[[Path], ReportT]
    required_assets: tuple[ProcessedAssetName, ...]
    overwrite: bool
    manifest_type: type[ManifestT]
    schema_type: type[SchemaT]
    report_type: type[ReportT]


@dataclass(frozen=True, slots=True)
class ProcessedPublicationResult[ManifestT: BaseModel]:
    coordinate_directory: Path
    publication_status: PublicationStatus
    manifest: ManifestT


def publish_processed[ManifestT: BaseModel, SchemaT: BaseModel, ReportT: BaseModel](
    publication: ProcessedPublication[ManifestT, SchemaT, ReportT],
) -> ProcessedPublicationResult[ManifestT]:
    target = publication.coordinate_directory
    target.parent.mkdir(parents=True, exist_ok=True)
    with FileLock(f"{target}.lock"):
        _remove_stale_staging_directories(target)
        if not publication.overwrite and _is_reusable(target, publication):
            return ProcessedPublicationResult(
                coordinate_directory=target,
                publication_status=PublicationStatus.REUSED,
                manifest=_read_model(target, ProcessedAssetName.PREPROCESSING_MANIFEST, publication.manifest_type),
            )
        if target.exists():
            rmtree(target)
        staging = Path(mkdtemp(prefix=f".{target.name}.", dir=target.parent))
        try:
            _write_processed(staging, publication)
            staging.replace(target)
        except Exception:
            if staging.exists():
                rmtree(staging, ignore_errors=True)
            raise
    return ProcessedPublicationResult(
        coordinate_directory=target,
        publication_status=PublicationStatus.PUBLISHED,
        manifest=publication.manifest,
    )


def complete_digest(manifest_payload: str, schema_payload: str) -> Checksum:
    return checksum_text(f"{manifest_payload}\\n{schema_payload}")


def _write_processed[ManifestT: BaseModel, SchemaT: BaseModel, ReportT: BaseModel](
    directory: Path,
    publication: ProcessedPublication[ManifestT, SchemaT, ReportT],
) -> None:
    report = publication.writer(directory)
    _write_model(publication.manifest, directory / ProcessedAssetName.PREPROCESSING_MANIFEST)
    _write_model(publication.schema, directory / ProcessedAssetName.SCHEMA)
    _write_model(report, directory / ProcessedAssetName.VALIDATION_REPORT)
    digest = complete_digest(
        (directory / ProcessedAssetName.PREPROCESSING_MANIFEST).read_text(encoding="utf-8"),
        (directory / ProcessedAssetName.SCHEMA).read_text(encoding="utf-8"),
    )
    (directory / ProcessedAssetName.COMPLETE).write_text(digest.value, encoding="utf-8")
    _assert_required_assets(directory, publication.required_assets)
    if not _is_reusable(directory, publication):
        raise ArtifactIntegrityError(
            "processed publication failed complete-asset validation",
            subject=ContractSubject.ARTIFACT_PATH,
        )


def _is_reusable[ManifestT: BaseModel, SchemaT: BaseModel, ReportT: BaseModel](
    directory: Path,
    publication: ProcessedPublication[ManifestT, SchemaT, ReportT],
) -> bool:
    try:
        manifest = _read_model(directory, ProcessedAssetName.PREPROCESSING_MANIFEST, publication.manifest_type)
        schema = _read_model(directory, ProcessedAssetName.SCHEMA, publication.schema_type)
        _read_model(directory, ProcessedAssetName.VALIDATION_REPORT, publication.report_type)
        expected = complete_digest(
            (directory / ProcessedAssetName.PREPROCESSING_MANIFEST).read_text(encoding="utf-8"),
            (directory / ProcessedAssetName.SCHEMA).read_text(encoding="utf-8"),
        )
        actual = Checksum((directory / ProcessedAssetName.COMPLETE).read_text(encoding="utf-8").strip())
    except (OSError, UnicodeError, ValidationError, ArtifactIntegrityError, ValueError):
        return False
    return (
        actual == expected
        and manifest == publication.manifest
        and schema == publication.schema
        and _assets_exist(directory, publication.required_assets)
    )


def _write_model(model: BaseModel, destination: Path) -> None:
    destination.parent.mkdir(parents=True, exist_ok=True)
    destination.write_text(canonical_json_text(model), encoding="utf-8")


def _read_model[ModelT: BaseModel](directory: Path, asset: ProcessedAssetName, model_type: type[ModelT]) -> ModelT:
    path = directory / asset
    if not path.is_file():
        raise ArtifactIntegrityError(f"missing {asset.value}", subject=ContractSubject.ARTIFACT_PATH)
    try:
        return model_type.model_validate_json(path.read_text(encoding="utf-8"))
    except (OSError, UnicodeError, ValidationError, ValueError) as error:
        raise ArtifactIntegrityError(
            f"invalid {asset.value}",
            subject=ContractSubject.ARTIFACT_PATH,
        ) from error


def _assets_exist(directory: Path, required_assets: tuple[ProcessedAssetName, ...]) -> bool:
    return all((directory / asset).is_file() for asset in required_assets)


def _assert_required_assets(directory: Path, required_assets: tuple[ProcessedAssetName, ...]) -> None:
    missing = tuple(asset for asset in required_assets if not (directory / asset).is_file())
    if missing:
        raise ArtifactIntegrityError(
            f"processed publication missing assets: {', '.join(asset.value for asset in missing)}",
            subject=ContractSubject.ARTIFACT_PATH,
        )


def _remove_stale_staging_directories(target: Path) -> None:
    if not target.parent.is_dir():
        return
    prefix = f".{target.name}."
    for candidate in sorted(target.parent.iterdir()):
        if candidate.is_dir() and candidate.name.startswith(prefix):
            rmtree(candidate, ignore_errors=True)
''', encoding='utf-8')

          def replace(path_text: str, old: str, new: str, count: int = 1) -> None:
              path = root / path_text
              text = path.read_text(encoding='utf-8')
              if text.count(old) != count:
                  raise SystemExit(f'{path_text}: expected {count} occurrences of {old!r}, found {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          # Dataset-owned canonical completion and domain-owned canonical encoding.
          replace(
              'src/datp_core/datasets/canonical_cache.py',
              'from datp_core.artifacts.completion import complete_digest\nfrom datp_core.artifacts.serialization import canonical_json_text, canonical_mapping, canonical_value\n',
              'from datp_core.domain.provenance import canonical_json_text, canonical_mapping, canonical_value\n',
          )
          cache = root / 'src/datp_core/datasets/canonical_cache.py'
          text = cache.read_text(encoding='utf-8')
          anchor = 'SourcePathResolver = Callable[[Path], Path]\n\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('canonical-cache insertion anchor is not unique')
          text = text.replace(
              anchor,
              anchor + 'def complete_digest(manifest_payload: str, schema_payload: str) -> Checksum:\n'
              '    return checksum_text(f"{manifest_payload}\\n{schema_payload}")\n\n\n',
          )
          cache.write_text(text, encoding='utf-8')
          replace(
              'src/datp_core/datasets/materialization.py',
              'from datp_core.artifacts.completion import complete_digest\n',
              '',
          )
          replace(
              'src/datp_core/datasets/materialization.py',
              '    canonical_directory,\n',
              '    canonical_directory,\n    complete_digest,\n',
          )

          # Canonical identities use the sole domain owner.
          canonical_files = (
              'src/datp_core/learning/federated/training.py',
              'src/datp_core/evaluation/population.py',
              'src/datp_core/evaluation/controls.py',
              'tests/unit/protocols/test_execution_identity.py',
          )
          for relative in canonical_files:
              path = root / relative
              text = path.read_text(encoding='utf-8')
              text = text.replace('datp_core.artifacts.serialization', 'datp_core.domain.provenance')
              path.write_text(text, encoding='utf-8')

          replace(
              'src/datp_core/pipeline/scoring/service.py',
              'from datp_core.artifacts.layout import scored_partition_roles\nfrom datp_core.artifacts.serialization import canonical_checksum\n',
              'from datp_core.domain.provenance import canonical_checksum\nfrom datp_core.preprocessing.contracts import scored_partition_roles\n',
          )
          replace(
              'src/datp_core/preprocessing/validation.py',
              'from datp_core.artifacts.serialization import canonical_checksum\nfrom datp_core.artifacts.store import ProcessedPublication, ProcessedPublicationResult, publish_processed\n',
              'from datp_core.domain.provenance import canonical_checksum\nfrom datp_core.preprocessing.publication import ProcessedPublication, ProcessedPublicationResult, publish_processed\n',
          )
          replace(
              'src/datp_core/preprocessing/service.py',
              'from datp_core.artifacts.coordinates import canonical_root_under\nfrom datp_core.artifacts.serialization import TrustedScaler, canonical_json_text\n',
              'from datp_core.datasets.core.contracts import canonical_root_under\nfrom datp_core.domain.provenance import canonical_json_text\n',
          )
          replace(
              'src/datp_core/preprocessing/service.py',
              'from datp_core.preprocessing.models import (\n',
              'from datp_core.preprocessing.models import (\n',
          )
          service = root / 'src/datp_core/preprocessing/service.py'
          text = service.read_text(encoding='utf-8')
          anchor = 'from datp_core.preprocessing.validation import extract_partitions\n'
          if text.count(anchor) != 1:
              raise SystemExit('preprocessing-state import anchor is not unique')
          service.write_text(
              text.replace(anchor, 'from datp_core.preprocessing.state import TrustedScaler\n' + anchor),
              encoding='utf-8',
          )

          # Checkpoint publication remains bounded but writes its own canonical manifest.
          replace(
              'src/datp_core/learning/federated/checkpoints/publication.py',
              'from datp_core.artifacts.serialization import canonical_checksum, serialize_json_model\n',
              'from datp_core.domain.provenance import canonical_checksum, canonical_json_text\n',
          )
          replace(
              'src/datp_core/learning/federated/checkpoints/publication.py',
              '''def write_manifest(directory: Path, manifest: CandidateManifest) -> None:\n    serialize_json_model(\n        manifest,\n        directory / FederatedHistoryAssetName.CANDIDATE_MANIFEST.value,\n    )\n''',
              '''def write_manifest(directory: Path, manifest: CandidateManifest) -> None:\n    destination = directory / FederatedHistoryAssetName.CANDIDATE_MANIFEST.value\n    destination.parent.mkdir(parents=True, exist_ok=True)\n    destination.write_text(canonical_json_text(manifest), encoding="utf-8")\n''',
          )

          # Test imports now name the scientific owners directly.
          for path in sorted((root / 'tests').rglob('*.py')):
              text = path.read_text(encoding='utf-8')
              text = text.replace('datp_core.artifacts.layout', 'datp_core.preprocessing.contracts')
              text = text.replace('datp_core.artifacts.reload_validation', 'datp_core.preprocessing.state')
              if 'datp_core.artifacts.serialization' in text:
                  if path.as_posix().endswith('tests/unit/protocols/test_execution_identity.py'):
                      text = text.replace('datp_core.artifacts.serialization', 'datp_core.domain.provenance')
                  else:
                      text = text.replace('datp_core.artifacts.serialization', 'datp_core.preprocessing.state')
              path.write_text(text, encoding='utf-8')

          coordinate_test = root / 'tests/unit/artifacts/test_data_coordinates.py'
          text = coordinate_test.read_text(encoding='utf-8')
          old = '''from datp_core.artifacts.coordinates import (\n    ReusableDataCoordinate,\n    federated_client_coordinate,\n    processed_branch_coordinate,\n    raw_dataset_directory,\n    raw_dataset_root,\n)\n'''
          new = '''from datp_core.datasets.core.contracts import raw_dataset_directory, raw_dataset_root\nfrom datp_core.preprocessing.contracts import (\n    ReusableDataCoordinate,\n    federated_client_coordinate,\n    processed_branch_coordinate,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit('coordinate-test import block did not match')
          coordinate_test.write_text(text.replace(old, new), encoding='utf-8')

          layout_test = root / 'tests/unit/artifacts/test_data_layout.py'
          text = layout_test.read_text(encoding='utf-8').replace(
              'datp_core.artifacts.coordinates', 'datp_core.preprocessing.contracts'
          )
          layout_test.write_text(text, encoding='utf-8')

          target_dir = root / 'tests/unit/preprocessing'
          target_dir.mkdir(parents=True, exist_ok=True)
          moves = {
              root / 'tests/unit/artifacts/test_preprocessing_serialization.py': target_dir / 'test_state_serialization.py',
              coordinate_test: target_dir / 'test_data_coordinates.py',
              layout_test: target_dir / 'test_data_layout.py',
          }
          for source, destination in moves.items():
              source.replace(destination)
          artifacts_test_dir = root / 'tests/unit/artifacts'
          if artifacts_test_dir.exists() and not any(artifacts_test_dir.iterdir()):
              artifacts_test_dir.rmdir()

          # Remove the superseded package and duplicate processed publisher.
          pipeline_processed = root / 'src/datp_core/pipeline/publication/processed.py'
          references = []
          for path in (root / 'src').rglob('*.py'):
              if path == pipeline_processed:
                  continue
              if 'datp_core.pipeline.publication.processed' in path.read_text(encoding='utf-8'):
                  references.append(str(path.relative_to(root)))
          if references:
              raise SystemExit(f'pipeline processed publisher still has callers: {references}')
          pipeline_processed.unlink()
          for path in sorted((root / 'src/datp_core/artifacts').glob('*.py')):
              path.unlink()
          (root / 'src/datp_core/artifacts').rmdir()

          # Make the deleted ownership impossible to reintroduce.
          ratchet = root / 'tests/architecture/test_architecture_ratchets.py'
          text = ratchet.read_text(encoding='utf-8')
          text = text.replace(
              '    SOURCE_ROOT / "centralized_reference",\n',
              '    SOURCE_ROOT / "centralized_reference",\n    SOURCE_ROOT / "artifacts",\n',
          )
          text = text.replace(
              '    "datp_core.centralized_reference",\n',
              '    "datp_core.centralized_reference",\n    "datp_core.artifacts",\n',
          )
          ratchet.write_text(text, encoding='utf-8')

          import_linter = root / '.importlinter'
          text = import_linter.read_text(encoding='utf-8')
          text = re.sub(
              r'\n\[importlinter:contract:artifact-direction\]\n.*?(?=\n\[importlinter:contract:protocol-direction\])',
              '',
              text,
              flags=re.S,
          )
          text = text.replace('    datp_core.artifacts\n', '')
          import_linter.write_text(text, encoding='utf-8')

          stale = []
          for base in (root / 'src', root / 'tests'):
              for path in base.rglob('*.py'):
                  if 'datp_core.artifacts' in path.read_text(encoding='utf-8'):
                      stale.append(str(path.relative_to(root)))
          if stale:
              raise SystemExit(f'stale artifact imports remain: {stale}')

          workflow = root / '.github/workflows/remove-artifacts-package.yml'
          workflow.unlink()
          PY

      - run: uv sync --all-groups --all-extras --frozen
      - run: uv run ruff format src tests noxfile.py
      - run: uv run ruff check src tests noxfile.py
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest tests/architecture tests/unit/preprocessing tests/integration/preprocessing -q
      - run: uv run pytest -q

      - name: Commit migration without force-updating concurrent work
        run: |
          set -euo pipefail
          branch='agent/phase-12-16-target-architecture'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove residual artifact ownership package'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            git pull --rebase origin "$branch"
          done
          exit 1
