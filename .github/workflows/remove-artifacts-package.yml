name: Remove residual artifacts package

on:
  push:
    branches:
      - agent/phase-12-16-target-architecture
    paths:
      - .github/workflows/remove-artifacts-package.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/phase-12-16-target-architecture
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Extract and execute reviewed migration
        run: |
          git show 5008cea7c49a93315fc00ab04e0463b960164cbc:.github/workflows/remove-artifacts-package.yml \
            | awk '/^          python <<'"'"'PY'"'"'$/{capture=1; next} /^          PY$/{capture=0} capture{sub(/^          /, ""); print}' \
            > /tmp/remove_artifacts_package.py
          test -s /tmp/remove_artifacts_package.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/remove_artifacts_package.py')
          text = path.read_text(encoding='utf-8')
          text, removed = re.subn(
              r"\npublication = root / 'src/datp_core/preprocessing/publication.py'\n.*?\ndef replace\(path_text:",
              "\ndef replace(path_text:",
              text,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f'generated publication block removal count was {removed}')

          validation_call = '''
          replace(
              'src/datp_core/preprocessing/validation.py',
              'from datp_core.pipeline.publication.processed import (\\n    ProcessedPublication,\\n    ProcessedPublicationResult,\\n    publish_processed,\\n)\\n',
              'from datp_core.preprocessing.publication import (\\n    ProcessedPublication,\\n    ProcessedPublicationResult,\\n    publish_processed,\\n)\\n',
          )
          '''
          text, validation_rewrites = re.subn(
              r"\nreplace\(\n    'src/datp_core/preprocessing/validation\.py',\n.*?\n\)\n",
              "\n" + validation_call.strip() + "\n",
              text,
              count=1,
              flags=re.S,
          )
          if validation_rewrites != 1:
              raise SystemExit(f'validation import rewrite count was {validation_rewrites}')

          old = "if 'datp_core.artifacts' in path.read_text(encoding='utf-8'):\n"
          new = (
              "if (\n"
              "    path != root / 'tests/architecture/test_architecture_ratchets.py'\n"
              "    and 'datp_core.artifacts' in path.read_text(encoding='utf-8')\n"
              "):\n"
          )
          if text.count(old) != 1:
              raise SystemExit('stale-import assertion patch did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python /tmp/remove_artifacts_package.py

      - run: uv sync --all-groups --all-extras --frozen

      - name: Apply safe Ruff fixes and strict manual fixes
        run: |
          uv run ruff check --fix src tests noxfile.py || true
          python <<'PY'
          from pathlib import Path

          serialization = Path('src/datp_core/pipeline/publication/serialization.py')
          text = serialization.read_text(encoding='utf-8')
          text = text.replace('from typing import TypeVar\n\n', '')
          text = text.replace('TModel = TypeVar("TModel", bound=BaseModel)\n\n\n', '')
          text = text.replace(
              'def load_model_json(model_type: type[TModel], text: str) -> TModel:\n',
              'def load_model_json[TModel: BaseModel](model_type: type[TModel], text: str) -> TModel:\n',
          )
          text = text.replace(
              'def load_model_file(model_type: type[TModel], path: Path) -> TModel:\n',
              'def load_model_file[TModel: BaseModel](model_type: type[TModel], path: Path) -> TModel:\n',
          )
          serialization.write_text(text, encoding='utf-8')

          thresholds = Path('src/datp_core/pipeline/construct_thresholds.py')
          text = thresholds.read_text(encoding='utf-8')
          old = (
              '    raise LeakageError(\n'
              '        f"federated score artifact \'{identity}\' (method={method.value}) cannot enter centralized threshold construction",\n'
              '        subject=ContractSubject.ARTIFACT_PATH,\n'
              '    )\n'
          )
          new = (
              '    raise LeakageError(\n'
              '        f"federated score artifact \'{identity}\' (method={method.value}) "\n'
              '        "cannot enter centralized threshold construction",\n'
              '        subject=ContractSubject.ARTIFACT_PATH,\n'
              '    )\n'
          )
          if text.count(old) != 1:
              raise SystemExit('centralized-threshold message did not match exactly once')
          thresholds.write_text(text.replace(old, new), encoding='utf-8')

          inference = Path('src/datp_core/protocols/inference.py')
          text = inference.read_text(encoding='utf-8')
          text = text.replace('    ) -> "FixedScoreInvariant":\n', '    ) -> FixedScoreInvariant:\n')
          old = (
              '                f"score record partition role {record.partition_role.value} '
              'does not match expected collection role {role.value}",\n'
          )
          new = (
              '                f"score record partition role {record.partition_role.value} "\n'
              '                f"does not match expected collection role {role.value}",\n'
          )
          if text.count(old) != 1:
              raise SystemExit('score-role message did not match exactly once')
          inference.write_text(text.replace(old, new), encoding='utf-8')

          validation = Path('src/datp_core/reporting/validation.py')
          text = validation.read_text(encoding='utf-8')
          old = (
              '                reason=f"confirmatory evidence is {request.evidence_decision.value} '
              'and cannot support a positive claim",\n'
          )
          new = (
              '                reason=(\n'
              '                    f"confirmatory evidence is {request.evidence_decision.value} "\n'
              '                    "and cannot support a positive claim"\n'
              '                ),\n'
          )
          if text.count(old) != 1:
              raise SystemExit('confirmatory-claim message did not match exactly once')
          validation.write_text(text.replace(old, new), encoding='utf-8')
          PY
          uv run ruff format src tests noxfile.py
          uv run ruff check --fix src tests noxfile.py
          uv run ruff check src tests noxfile.py

      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest tests/architecture tests/unit/preprocessing tests/integration/preprocessing -q
      - run: uv run pytest -q

      - name: Commit migration without force-updating concurrent work
        run: |
          set -euo pipefail
          branch='agent/phase-12-16-target-architecture'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove residual artifact ownership package'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            git pull --rebase origin "$branch"
          done
          exit 1
