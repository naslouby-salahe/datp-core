[project]
name = "datp-core"
version = "0.1.0"
description = "DATP journal-extension implementation: fixed-detector threshold-calibration-scope study."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.0",
    "filelock>=3.0",
    "networkx>=3.0",
    "numpy==2.5.1",
    "pyarrow==25.0.0",
    "polars>=0.20",
    "pandera>=0.18",
    "duckdb>=0.10",
    "datasketches==5.2.0",
    "matplotlib>=3.10",
    "torch==2.10.0",
    "scikit-learn==1.9.0",
    "safetensors>=0.4",
    "scipy==1.18.0",
    "structlog>=24.1",
    "pingouin>=0.5",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "typer>=0.20.1",
    "rich>=13.7",
    "shellingham>=1.5.4",
    "skops>=0.14.0",
]

[project.optional-dependencies]
hardware = [
    "psutil>=5.9",
    "pynvml>=11.5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "import-linter>=2.0",
    "nox>=2024.4.15",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "pylint>=4.0.6",
]

[project.scripts]
datp-core = "datp_core.app.cli.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--import-mode=importlib", "-p", "tests.pytest_cuda"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ICN"]

[tool.ruff.lint.per-file-ignores]
"typings/**/*.pyi" = ["N803", "N818"]
"__init__.py" = ["F401"]

[tool.pyright]
include = ["src", "tests"]
strict = [
    "src/datp_core/app",
    "src/datp_core/experiments",
    "src/datp_core/analysis",
    "src/datp_core/data",
    "src/datp_core/detector",
    "src/datp_core/thresholds",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
executionEnvironments = [{ root = "tests", extraPaths = ["."] }]
